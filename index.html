:root{--bg:#fbfbfa;--card:#fff;--text:#1f1f1d;--muted:#77756f;--border:#e5e3df;--green:#1f5f2b;--highlight:#fff3b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrapper{max-width:1040px;margin:0 auto;padding:28px 18px 70px}header{margin-bottom:18px}h1{font-size:2rem;line-height:1.08;margin:0 0 6px;font-weight:850;letter-spacing:-.03em}.subtitle{color:var(--muted);font-size:.95rem}.controls{position:sticky;top:0;z-index:20;background:rgba(251,251,250,.94);backdrop-filter:blur(14px);padding:12px 0 14px;border-bottom:1px solid rgba(229,227,223,.68)}.panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.035)}.search-wrap{position:relative;margin-bottom:14px}.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#aaa;font-size:1.1rem}#search{width:100%;border:1px solid var(--border);border-radius:14px;background:#fff;padding:14px 18px 14px 46px;font-size:1rem;outline:0}#search:focus{border-color:#bfc7bd;box-shadow:0 0 0 3px rgba(31,95,43,.06)}.filter-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filter{border:1px solid var(--border);background:#fff;color:#3f3f3b;border-radius:999px;padding:8px 13px;font-size:.84rem;font-weight:700;cursor:pointer}.filter.active{border-color:var(--green);background:#edf7ef;color:var(--green)}.counter{font-size:.86rem;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid #f0efec}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.02);margin-bottom:11px}.card.open{border-color:#c7c5bd;box-shadow:0 6px 16px rgba(0,0,0,.045)}.card-btn{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;border:0;background:transparent;padding:18px 20px;cursor:pointer;text-align:left}.num{font-size:.78rem;color:var(--muted);font-weight:800;text-align:right}.title{font-size:1.01rem;line-height:1.35;font-weight:780;letter-spacing:-.01em}.tags{font-size:.74rem;color:var(--muted);font-weight:750;white-space:nowrap;letter-spacing:.03em}.chev{color:#aaa;margin-left:10px;display:inline-block;transition:.16s transform}.card.open .chev{transform:rotate(180deg)}.body{display:none;border-top:1px solid var(--border);padding:24px 30px 28px 78px;font-size:1.03rem;line-height:1.58;color:#333}.card.open .body{display:block}.body p{margin:0 0 15px}.body p:last-child{margin-bottom:0}.body strong{font-weight:850;color:#1f1f1d;box-shadow:inset 0 -0.42em 0 var(--highlight)}.hl-key{color:#0b6b3a;font-weight:800;text-decoration:underline;text-decoration-color:#98d8aa;text-decoration-thickness:2px}.tag-badge{display:inline-flex;align-items:center;border-radius:7px;padding:4px 8px;margin:0 3px 0 0;font-size:.7rem;font-weight:850;letter-spacing:.02em;text-transform:uppercase}.tag-recruiter{background:#eef2ff;color:#3730a3}.tag-ui{background:#f5f3ff;color:#6d28d9}.tag-product{background:#ecfdf5;color:#047857}.tag-pm{background:#fff7ed;color:#c2410c}.tag-dev{background:#eff6ff;color:#1d4ed8}.tag-marketing{background:#fdf2f8;color:#be185d}.tag-cro-ecommerce{background:#fef3c7;color:#92400e}.tag-empresa{background:#f3f4f6;color:#374151}.tag-kiwiplates{background:#fff3e2;color:#b35d08}.tag-huntech{background:#fef2f2;color:#991b1b}.tag-entain{background:#f3e8ff;color:#6b21a8}.minihead{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#555;font-weight:850;margin:22px 0 12px}.minihead:first-child{margin-top:0}.link-url{color:#1d4ed8;text-decoration:none;font-weight:650;word-break:break-word}.link-url:hover{text-decoration:underline}.empty{display:none;margin:28px 0;padding:28px;border:1px dashed var(--border);border-radius:14px;background:#fff;color:var(--muted);text-align:center}.group-title{display:none}body.kiwi-mode .group-title{display:flex;align-items:center;gap:12px;margin:24px 0 10px;color:#555;font-size:.82rem;font-weight:850;text-transform:uppercase;letter-spacing:.08em}body.kiwi-mode .group-title::after{content:"";height:1px;background:var(--border);flex:1}@media(max-width:760px){.wrapper{padding:18px 10px 46px}h1{font-size:1.45rem}.panel{padding:13px;border-radius:14px}.filter{font-size:.8rem;padding:7px 10px}.card-btn{grid-template-columns:28px 1fr;gap:10px;padding:15px 14px}.tags{grid-column:2;white-space:normal;line-height:1.35}.body{padding:19px 16px 22px;font-size:1rem}.num{text-align:left}}

.study-meta{margin-top:22px;padding:16px 18px;border:1px solid #e7e5df;border-radius:12px;background:#faf9f6}

@media(max-width:760px){.study-grid{grid-template-columns:1fr}}

<div class="wrapper"><header><h1>Master Interview Playbook</h1><div class="subtitle">Product Designer / UI Specialist / Digital Designer · Dario Bazan</div></header><div class="controls"><div class="panel"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" placeholder="Search — e.g. Figma, CRO, PM, handoff, KiwiPlates, salary..." /></div><div class="filter-group" id="filters"></div><div class="counter">Showing <strong id="count">0</strong> items</div></div></div><div id="content"></div><div class="empty" id="empty">No questions found.</div></div>
<script>
const questions = [{"id": 1, "title": "Tell me about yourself and your experience", "tags": ["RECRUITER", "ALL"], "body": "<p>I'm Dario, a Product Designer based in Auckland with a strong UI focus and a background in Graphic Design.</p>\n<p>My experience combines product design, eCommerce, CRO, digital design, and marketing.</p>\n<p>At Tourism Waitaki, I worked across multiple tourism brands as the sole designer, delivering websites, landing pages, campaigns, EDMs, social media, print, and brand communications.</p>\n<p>More recently, at Blackpepper, a specialist eCommerce agency, I designed digital experiences for brands including Starbucks, Crocs, Glassons, Torpedo7, Hallenstein, and King Plant Barn across New Zealand, Australia, and the UK.</p>\n<p>My strength is translating business goals, available insights, UX principles, and technical constraints into clear, high-performing interfaces.</p>\n<p>I'm now looking for a role where I can continue growing in product, eCommerce, and CRO while also contributing across broader digital and marketing initiatives.</p>", "story": "Career narrative: Tourism Waitaki → Blackpepper → next role", "keywords": ["UI focus", "Product Design", "Digital Design", "eCommerce", "CRO"], "also_answers": ["background", "career story", "experience summary", "professional positioning"], "difficulty": "High", "frequency": "Very common"}, {"id": 2, "title": "Why are you looking for a new role?", "tags": ["RECRUITER"], "body": "<p>Blackpepper went through a restructure after losing some major clients, and my role was made redundant.</p>\n<p>It was a business decision rather than a performance issue. I had a positive relationship with the team, and both my Design Lead and the CEO are available as references.</p>\n<p>I valued my time there, particularly the exposure to eCommerce, CRO, design systems, and cross-functional delivery. I'm now ready to bring that experience into my next role.</p>", "story": "Recruiter essentials", "keywords": ["clear", "direct", "confident", "brief"], "also_answers": ["screening call", "availability", "salary", "work rights"], "difficulty": "Low", "frequency": "Very common"}, {"id": 3, "title": "Do you have the right to work in New Zealand?", "tags": ["RECRUITER"], "body": "<p>Yes. I'm a New Zealand Permanent Resident with full, unrestricted work rights.</p>", "story": "Recruiter essentials", "keywords": ["clear", "direct", "confident", "brief"], "also_answers": ["screening call", "availability", "salary", "work rights"], "difficulty": "Low", "frequency": "Very common"}, {"id": 4, "title": "What are your salary expectations?", "tags": ["RECRUITER"], "body": "<p>Based on the responsibilities and market level, I'm targeting approximately NZD 85,000 to 95,000. However, I'm open to discussing the full package and the scope of the opportunity.</p>", "story": "Recruiter essentials", "keywords": ["clear", "direct", "confident", "brief"], "also_answers": ["screening call", "availability", "salary", "work rights"], "difficulty": "Low", "frequency": "Very common"}, {"id": 5, "title": "When can you start?", "tags": ["RECRUITER"], "body": "<p>I'm available to start immediately, subject to any commitments already discussed during the process.</p>", "story": "Recruiter essentials", "keywords": ["clear", "direct", "confident", "brief"], "also_answers": ["screening call", "availability", "salary", "work rights"], "difficulty": "Low", "frequency": "Very common"}, {"id": 6, "title": "What type of role are you looking for?", "tags": ["RECRUITER", "COMPANY"], "body": "<p>I'm looking for a Product Designer, UI Designer, Digital Designer, or hybrid role where I can combine strong interface design with business thinking and technical collaboration.</p>\n<p>I'd particularly like to continue developing my eCommerce and CRO experience, while remaining open to other digital products, services, and industries.</p>", "story": "Company-specific preparation", "keywords": ["company research", "role fit", "product", "business challenge", "relevant experience"], "also_answers": ["why us", "why this role", "company knowledge", "first 90 days"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 7, "title": "Why do you want to work here?", "tags": ["COMPANY", "RECRUITER"], "body": "<p>I'm looking for an environment where design, business, marketing, and technology work closely together, because that's where I believe I add the most value.</p>\n<p>This role interests me because it appears to combine <span class=\"hl-key\">[insert the role's strongest match: product, UI, eCommerce, CRO, marketing, autonomy, or collaboration]</span>.</p>\n<p>After researching the company, I was particularly interested in <span class=\"hl-key\">[insert one specific product, business challenge, value, or recent initiative]</span>.</p>\n<p>My experience in <span class=\"hl-key\">[select the most relevant Blackpepper or Tourism Waitaki example]</span> would allow me to contribute quickly while continuing to grow in the areas that matter for this role.</p>", "story": "Company-specific preparation", "keywords": ["company research", "role fit", "product", "business challenge", "relevant experience"], "also_answers": ["why us", "why this role", "company knowledge", "first 90 days"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 8, "title": "What do you know about our company and product?", "tags": ["COMPANY"], "body": "<p>I would structure this answer in three parts.</p>\n<p><strong>First:</strong> what the company does, who its customers are, and how it makes money or creates value.</p>\n<p><strong>Second:</strong> what makes the product, service, or market challenging from a design perspective.</p>\n<p><strong>Third:</strong> where my experience connects directly to those challenges.</p>\n<p>I would finish with one informed observation or question, making it clear that I don't have access to internal analytics, customer research, technical constraints, or current priorities.</p>", "story": "Company-specific preparation", "keywords": ["company research", "role fit", "product", "business challenge", "relevant experience"], "also_answers": ["why us", "why this role", "company knowledge", "first 90 days"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 9, "title": "Why do you think you're a good fit for this role?", "tags": ["COMPANY", "RECRUITER"], "body": "<p>I bring a combination of Product Design, UI, eCommerce, CRO-informed thinking, digital marketing, and brand experience.</p>\n<p>At Blackpepper, I worked on high-profile eCommerce platforms, design systems, conversion-focused UI, and developer handoff. At Tourism Waitaki, I worked across websites, landing pages, campaigns, EDMs, social media, print, and multiple brands.</p>\n<p>That means I can contribute to both focused product work and broader digital initiatives, while connecting user needs, business goals, and technical feasibility.</p>", "story": "Company-specific preparation", "keywords": ["company research", "role fit", "product", "business challenge", "relevant experience"], "also_answers": ["why us", "why this role", "company knowledge", "first 90 days"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 10, "title": "What design tools do you use?", "tags": ["RECRUITER", "UI", "DIGITAL"], "body": "<p>Figma is my main product and interface design tool. I use it for wireframes, high-fidelity UI, prototypes, shared libraries, responsive layouts, components, and developer handoff.</p>\n<p>I also use Photoshop, Illustrator, and InDesign for digital marketing, branding, presentations, image work, and print production.</p>\n<p>For web publishing, I have experience with Framer and WordPress, and I have worked with EDM platforms including Mailchimp and Dotdigital.</p>\n<p>I also use AI tools to improve documentation, clarify briefs, explore ideas, and reduce repetitive work.</p>", "story": "Tourism Waitaki + Blackpepper marketing work", "keywords": ["campaigns", "EDMs", "landing pages", "brand consistency", "stakeholders"], "also_answers": ["digital design", "marketing collaboration", "multiple brands", "campaign delivery"], "difficulty": "Medium", "frequency": "Common"}, {"id": 11, "title": "What is your design process?", "tags": ["PRODUCT", "UX", "UI"], "body": "<p>My process changes depending on the project, but I follow a consistent structure.</p>\n<p>First, I clarify the problem, user needs, business goals, success criteria, technical constraints, and available evidence.</p>\n<p>Then I review the current experience, which may include heuristic evaluation, existing research, analytics supplied by the team, stakeholder knowledge, or customer feedback.</p>\n<p>I prioritise the highest-impact opportunities, explore solutions through wireframes, and move into high-fidelity UI and prototyping once the direction is clear.</p>\n<p>I collaborate with developers and stakeholders throughout the process, prepare a clean handoff, review the implementation, and use any available post-launch evidence to identify further improvements.</p>", "story": "Blackpepper design systems and UI delivery", "keywords": ["components", "consistency", "scalability", "responsive design", "developer handoff"], "also_answers": ["UI", "design systems", "technical delivery", "accessibility"], "difficulty": "Medium", "frequency": "Common"}, {"id": 12, "title": "How do you balance user needs, business goals, and technical constraints?", "tags": ["PRODUCT", "UX", "STAKEHOLDERS", "DEVELOPERS"], "body": "<p>I believe the strongest solutions create value for both users and the business while remaining realistic to build.</p>\n<p>I begin by understanding what users need to accomplish, what outcome the business is trying to achieve, and what technical constraints may affect the solution.</p>\n<p>When there are trade-offs, I make them visible and work with the team to prioritise the option that protects the core experience while supporting the most important business goal.</p>\n<p>My role is not to defend a design at all costs. It is to help the team reach the best feasible outcome.</p>", "story": "Store Availability / Blackpepper developer collaboration", "keywords": ["technical constraints", "feasibility", "handoff", "trade-offs", "collaboration"], "also_answers": ["developer collaboration", "technical limitations", "communication", "implementation"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 13, "title": "How do you prioritise what to improve first?", "tags": ["PRODUCT", "ECOMMERCE / CRO", "CASE STUDIES"], "body": "<p>I start by identifying the areas with the greatest potential impact for users and the business.</p>\n<p>In Huntech, I conducted a heuristic evaluation across the purchase journey and grouped the findings into strategic themes. Rather than trying to improve everything at once, we prioritised the PLP and PDP, where reducing uncertainty and friction was expected to have the greatest impact on conversion.</p>\n<p>I also consider implementation effort, dependencies, technical feasibility, and the confidence level behind each assumption.</p>\n<p>Prioritisation is about focusing the team's effort where it can create the most value.</p>", "story": "Huntech", "keywords": ["heuristic evaluation", "friction", "prioritisation", "UI decisions", "conversion", "business impact"], "also_answers": ["CRO", "business impact", "prioritisation", "design process", "product thinking"], "difficulty": "High", "frequency": "Very common"}, {"id": 14, "title": "How do you measure whether a design is successful?", "tags": ["PRODUCT", "ECOMMERCE / CRO"], "body": "<p>Success depends on the goals of the project.</p>\n<p>I look at whether the design reduces friction, improves clarity and usability, and helps users complete their tasks while supporting the intended business outcome.</p>\n<p>In eCommerce, relevant indicators may include conversion rate, cart abandonment, average order value, engagement with key features, or fewer barriers in the purchase journey.</p>\n<p>I haven't always owned measurement directly, but I design with those outcomes in mind and use the evidence available to the team to support continuous improvement.</p>", "story": "Blackpepper + Huntech", "keywords": ["conversion", "cart abandonment", "AOV", "friction", "commercial outcomes"], "also_answers": ["eCommerce", "CRO", "metrics", "business outcomes"], "difficulty": "Medium", "frequency": "Common"}, {"id": 15, "title": "How do you analyse user behaviour to improve your designs?", "tags": ["UX", "PRODUCT", "ECOMMERCE / CRO", "CASE STUDIES"], "body": "<p>I start by reviewing the available data, business insights, and key friction points in the user journey.</p>\n<p>At Blackpepper, I used heuristic evaluation to identify usability issues across important eCommerce flows, particularly Product Listing Pages and Product Detail Pages.</p>\n<p>In Huntech, I identified issues around mobile navigation, filtering, stock visibility, size selection, product information, and calls to action.</p>\n<p>My role was to translate those findings into clearer layouts, more intuitive components, and practical UI improvements in Figma that supported usability and conversion.</p>", "story": "Huntech", "keywords": ["heuristic evaluation", "friction", "prioritisation", "UI decisions", "conversion", "business impact"], "also_answers": ["CRO", "business impact", "prioritisation", "design process", "product thinking"], "difficulty": "High", "frequency": "Very common"}, {"id": 16, "title": "Do you have experience with UX research, A/B testing, heatmaps, or journey maps?", "tags": ["UX", "PRODUCT", "RECRUITER", "ECOMMERCE / CRO"], "body": "<p>I studied UX/UI formally, so I understand these methodologies and how they fit into the product design process.</p>\n<p>Professionally, my strongest hands-on experience has been applying UX principles, heuristic evaluation, and available insights to inform design decisions.</p>\n<p>At Blackpepper, my role wasn't to run experiments. It was to translate available insights into intuitive UI solutions that supported usability, business goals, and conversion.</p>\n<p>Working in a CRO-focused eCommerce agency taught me to think beyond the interface. Every design decision needed to consider the user, the business, and the potential commercial impact.</p>\n<p>While I haven't led activities such as A/B testing, user interviews, or heatmap analysis, I already design with a CRO mindset and would like to deepen my practical experience with experimentation over time.</p>", "story": "Blackpepper: UX-informed and CRO-focused design", "keywords": ["UX principles", "heuristic evaluation", "available insights", "experimentation", "honesty"], "also_answers": ["UX research", "A/B testing", "heatmaps", "growth area"], "difficulty": "High", "frequency": "Common"}, {"id": 17, "title": "Have you conducted a heuristic evaluation or UX audit?", "tags": ["UX", "ECOMMERCE / CRO", "CASE STUDIES"], "body": "<p>Yes. At Blackpepper, heuristic evaluation was part of my hands-on design process.</p>\n<p>I reviewed key journeys, screens, interactions, and mobile behaviours to identify usability issues, friction points, inconsistencies, and areas of uncertainty.</p>\n<p>In Huntech, I used that process to identify and prioritise opportunities across navigation, filtering, stock and size visibility, product information, calls to action, and product merchandising.</p>\n<p>The findings then informed the UI direction, component decisions, and priorities for delivery.</p>", "story": "Huntech", "keywords": ["heuristic evaluation", "friction", "prioritisation", "UI decisions", "conversion", "business impact"], "also_answers": ["CRO", "business impact", "prioritisation", "design process", "product thinking"], "difficulty": "High", "frequency": "Very common"}, {"id": 18, "title": "What is the difference between UI and UX?", "tags": ["UI", "UX"], "body": "<p>UI is primarily concerned with the interface: hierarchy, typography, spacing, components, interaction states, consistency, and visual communication.</p>\n<p>UX is broader. It focuses on how clearly and efficiently a user can understand the experience, move through it, and achieve a goal.</p>\n<p>A product can look polished but still create a poor experience if the navigation is confusing, the content is unclear, or the purchase flow introduces unnecessary friction.</p>\n<p>My professional strength is UI, informed by UX principles, heuristic evaluation, business goals, and available insights.</p>", "story": "Blackpepper design systems and UI delivery", "keywords": ["components", "consistency", "scalability", "responsive design", "developer handoff"], "also_answers": ["UI", "design systems", "technical delivery", "accessibility"], "difficulty": "Medium", "frequency": "Common"}, {"id": 19, "title": "How do you approach responsive design?", "tags": ["UI", "DEVELOPERS", "DIGITAL"], "body": "<p>I design responsively from the beginning rather than treating mobile as a reduced desktop layout.</p>\n<p>I consider content priority, touch targets, navigation behaviour, component flexibility, readability, image treatment, and how actions remain accessible at each breakpoint.</p>\n<p>In Figma, I use auto layout, reusable components, constraints, and responsive variants where appropriate.</p>\n<p>I also review the implementation with developers across devices to make sure the intended hierarchy and behaviour have been preserved.</p>", "story": "Store Availability / Blackpepper developer collaboration", "keywords": ["technical constraints", "feasibility", "handoff", "trade-offs", "collaboration"], "also_answers": ["developer collaboration", "technical limitations", "communication", "implementation"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 20, "title": "How do you use design systems and component libraries?", "tags": ["UI", "DEVELOPERS", "PRODUCT"], "body": "<p>At Blackpepper, I contributed to expanding and maintaining design systems for multiple eCommerce clients.</p>\n<p>I added components, refined existing ones, worked with shared libraries, variants, and auto layout, and made sure patterns remained consistent and scalable.</p>\n<p>I see a design system as a shared product rather than simply a Figma library. It should help designers and developers work faster, reduce inconsistencies, support accessibility, and make future changes easier.</p>", "story": "Store Availability / Blackpepper developer collaboration", "keywords": ["technical constraints", "feasibility", "handoff", "trade-offs", "collaboration"], "also_answers": ["developer collaboration", "technical limitations", "communication", "implementation"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 21, "title": "What are design tokens, and how would you use them?", "tags": ["UI", "DEVELOPERS"], "body": "<p>Design tokens are reusable values that represent design decisions such as colour, typography, spacing, border radius, shadows, or motion.</p>\n<p>They create a shared language between design and development and make a system easier to maintain across products and platforms.</p>\n<p>In practice, I would use tokens to avoid isolated values, support themes and responsive behaviour, and make global updates more consistent.</p>\n<p>My strongest practical experience has been with shared styles, components, variants, and scalable Figma libraries, and I continue developing my knowledge of more advanced token workflows.</p>", "story": "Store Availability / Blackpepper developer collaboration", "keywords": ["technical constraints", "feasibility", "handoff", "trade-offs", "collaboration"], "also_answers": ["developer collaboration", "technical limitations", "communication", "implementation"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 22, "title": "How do you ensure accessibility in your designs?", "tags": ["UI", "UX", "DEVELOPERS"], "body": "<p>I consider accessibility throughout the design process rather than as a final check.</p>\n<p>I pay attention to colour contrast, hierarchy, typography, touch target size, focus and interaction states, form clarity, error messaging, and responsive readability.</p>\n<p>I also avoid relying on colour alone to communicate meaning and make sure components can support keyboard, screen-reader, and development requirements.</p>\n<p>When the project requires formal compliance, I work with the team to align the design with the relevant WCAG level and implementation constraints.</p>", "story": "Store Availability / Blackpepper developer collaboration", "keywords": ["technical constraints", "feasibility", "handoff", "trade-offs", "collaboration"], "also_answers": ["developer collaboration", "technical limitations", "communication", "implementation"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 23, "title": "Tell me about your digital marketing and EDM experience", "tags": ["MARKETING", "DIGITAL", "RECRUITER"], "body": "<p>I have extensive experience supporting marketing teams across both in-house and agency environments.</p>\n<p>At Tourism Waitaki, I delivered campaigns, landing pages, social media assets, EDMs, digital advertising, presentations, print, signage, and brand communications across multiple tourism brands.</p>\n<p>At Blackpepper, alongside product and eCommerce work, I produced EDMs, campaign assets, social content, presentations, and client-facing digital collateral.</p>\n<p>I use the brief, audience, objective, channel, brand guidelines, and desired action to shape the design rather than treating each asset as an isolated piece.</p>", "story": "Tourism Waitaki + Blackpepper marketing work", "keywords": ["campaigns", "EDMs", "landing pages", "brand consistency", "stakeholders"], "also_answers": ["digital design", "marketing collaboration", "multiple brands", "campaign delivery"], "difficulty": "Medium", "frequency": "Common"}, {"id": 24, "title": "How do you collaborate with marketing teams?", "tags": ["MARKETING", "DIGITAL", "STAKEHOLDERS"], "body": "<p>I begin by understanding the campaign goal, target audience, key message, channel requirements, deadlines, and intended action.</p>\n<p>I work with marketing to clarify priorities and make sure the creative idea can translate consistently across landing pages, EDMs, social assets, paid media, presentations, and other touchpoints.</p>\n<p>I also bring a product mindset to marketing work by considering clarity, usability, conversion, and how each asset connects to the wider customer journey.</p>", "story": "Tourism Waitaki + Blackpepper marketing work", "keywords": ["campaigns", "EDMs", "landing pages", "brand consistency", "stakeholders"], "also_answers": ["digital design", "marketing collaboration", "multiple brands", "campaign delivery"], "difficulty": "Medium", "frequency": "Common"}, {"id": 25, "title": "How do you maintain brand consistency across channels?", "tags": ["MARKETING", "DIGITAL", "UI"], "body": "<p>I begin with the brand's core principles: positioning, audience, visual language, tone, typography, colour, imagery, and behavioural rules.</p>\n<p>Then I adapt those principles to the requirements of each channel rather than copying the same layout everywhere.</p>\n<p>At Tourism Waitaki and Blackpepper, I worked across websites, apps, EDMs, campaigns, social media, presentations, print, and signage, so consistency needed to remain recognisable while still being appropriate for each format.</p>", "story": "Tourism Waitaki + Blackpepper marketing work", "keywords": ["campaigns", "EDMs", "landing pages", "brand consistency", "stakeholders"], "also_answers": ["digital design", "marketing collaboration", "multiple brands", "campaign delivery"], "difficulty": "Medium", "frequency": "Common"}, {"id": 26, "title": "What is CRO?", "tags": ["ECOMMERCE / CRO", "PRODUCT"], "body": "<p>CRO, or Conversion Rate Optimisation, is the process of reducing friction and improving an experience so more users can complete an important goal.</p>\n<p>In eCommerce, that goal may be purchasing, adding to cart, finding the right product, completing checkout, or increasing the value of an order.</p>\n<p>For me, CRO is not about manipulating users. It is about improving clarity, confidence, relevance, and usability in ways that also support commercial outcomes.</p>", "story": "Blackpepper + Huntech", "keywords": ["conversion", "cart abandonment", "AOV", "friction", "commercial outcomes"], "also_answers": ["eCommerce", "CRO", "metrics", "business outcomes"], "difficulty": "Medium", "frequency": "Common"}, {"id": 27, "title": "How do you approach CRO and conversion-focused design?", "tags": ["ECOMMERCE / CRO", "PRODUCT", "CASE STUDIES"], "body": "<p>I begin by understanding the commercial goal and reviewing the available evidence.</p>\n<p>My strongest hands-on method has been heuristic evaluation, combined with business insights, existing data, stakeholder knowledge, and eCommerce best practices.</p>\n<p>I identify friction and uncertainty across the journey, prioritise the highest-impact opportunities, and translate them into practical UI improvements.</p>\n<p>I then consider how the changes should be validated and measured. I haven't owned formal experimentation such as A/B testing, but I understand its role and would like to become more involved in that part of the process.</p>", "story": "Huntech", "keywords": ["heuristic evaluation", "friction", "prioritisation", "UI decisions", "conversion", "business impact"], "also_answers": ["CRO", "business impact", "prioritisation", "design process", "product thinking"], "difficulty": "High", "frequency": "Very common"}, {"id": 28, "title": "Which eCommerce metrics matter most to you?", "tags": ["ECOMMERCE / CRO", "PRODUCT"], "body": "<p>The right metrics depend on the problem, but the main commercial measures I consider are conversion rate, cart abandonment, and average order value.</p>\n<p>Conversion rate indicates whether users can complete the core goal. Cart abandonment helps identify friction near the end of the purchase journey. Average order value shows whether the experience supports relevant upselling, cross-selling, or product discovery.</p>\n<p>I would also consider engagement with search, filters, size guides, stock information, product recommendations, and key calls to action depending on the solution.</p>", "story": "Blackpepper + Huntech", "keywords": ["conversion", "cart abandonment", "AOV", "friction", "commercial outcomes"], "also_answers": ["eCommerce", "CRO", "metrics", "business outcomes"], "difficulty": "Medium", "frequency": "Common"}, {"id": 29, "title": "How do you improve an eCommerce platform you're new to?", "tags": ["ECOMMERCE / CRO", "PRODUCT"], "body": "<p>First, I learn about the business model, customers, product range, commercial goals, technical platform, and current priorities.</p>\n<p>Then I review available analytics, customer feedback, previous research, and stakeholder knowledge before conducting a heuristic evaluation of the key journeys, particularly on mobile.</p>\n<p>I focus on high-impact areas such as navigation, search, PLP, PDP, cart, checkout, trust, stock, sizing, product information, and merchandising.</p>\n<p>I would prioritise rather than redesign everything, define how success should be measured, and work closely with development and stakeholders to deliver improvements iteratively.</p>", "story": "Blackpepper + Huntech", "keywords": ["conversion", "cart abandonment", "AOV", "friction", "commercial outcomes"], "also_answers": ["eCommerce", "CRO", "metrics", "business outcomes"], "difficulty": "Medium", "frequency": "Common"}, {"id": 30, "title": "Tell me about your Shopify experience", "tags": ["ECOMMERCE / CRO", "RECRUITER", "DEVELOPERS"], "body": "<p>I want to be precise about my Shopify experience.</p>\n<p>Blackpepper became a Shopify partner relatively recently, so my direct project exposure to the platform was limited compared with my broader eCommerce experience.</p>\n<p>However, I have strong experience designing responsive eCommerce interfaces, modular components, design systems, PLPs, PDPs, navigation, filters, and conversion-focused journeys while working closely with developers.</p>\n<p>I understand that Shopify has platform conventions and implementation constraints, and I'm actively interested in deepening that platform-specific experience.</p>", "story": "Store Availability / Blackpepper developer collaboration", "keywords": ["technical constraints", "feasibility", "handoff", "trade-offs", "collaboration"], "also_answers": ["developer collaboration", "technical limitations", "communication", "implementation"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 31, "title": "Walk me through the Huntech project", "tags": ["CASE STUDIES","HUNTECH","ECOMMERCE / CRO","PRODUCT","UI"], "body": "<div class=\"minihead\">Context and role</div>\n<p>Huntech is a New Zealand outdoor retailer specialising in technical hunting gear and equipment. Its eCommerce experience was no longer supporting the needs of the business or providing the clarity customers needed.</p>\n<p>My role was to lead the UI design within a multidisciplinary team under our Design Lead.</p>\n<div class=\"minihead\">Problem and analysis</div>\n<p>I conducted a heuristic evaluation of the customer journey to identify friction affecting usability, business goals, and conversion.</p>\n<p>The review surfaced opportunities around navigation, search, mobile filtering, stock and size visibility, product information, calls to action, and product merchandising.</p>\n<p>We prioritised mobile PLP and PDP improvements because those areas had the greatest potential to reduce uncertainty and help users make purchase decisions with more confidence.</p>\n<div class=\"minihead\">Solutions</div>\n<p>I translated the findings into practical UI decisions: clearer stock and sizing patterns, a more visible size guide, guided search, visual category navigation, combined filtering and sorting, touch-safe mobile controls, clearer product benefits, a sticky Add to Cart action, quick add, and more consistent product cards.</p>\n<div class=\"minihead\">Design system and delivery</div>\n<p>I contributed new and refined components to the design system, prepared responsive high-fidelity designs and prototypes in Figma, and supported developer handoff and implementation.</p>\n<div class=\"minihead\">Outcome</div>\n<p>After launch, the agency reported a 125% increase in revenue and a 41% increase in average order value year on year.</p>\n<p>Many factors can influence commercial performance, so I don't attribute those results solely to design. However, the project demonstrated how reducing friction and improving the purchase journey can support meaningful business outcomes.</p>\n<div class=\"minihead\">Why it matters</div>\n<p>I'm proud of this project because it showed that thoughtful UI design is not only about aesthetics. By combining heuristic evaluation, business thinking, and a CRO mindset, we created a clearer experience for users while supporting commercial goals.</p>", "story": "Huntech", "keywords": ["heuristic evaluation", "friction", "prioritisation", "UI decisions", "conversion", "business impact"], "also_answers": ["CRO", "business impact", "prioritisation", "design process", "product thinking"], "difficulty": "High", "frequency": "Very common"}, {"id": 32, "title": "How did you identify the Huntech opportunities?", "tags": ["CASE STUDIES","HUNTECH","ECOMMERCE / CRO","UX"], "body": "<p>I identified them through a structured heuristic evaluation of the purchase journey.</p>\n<p>I reviewed the experience across mobile navigation, search, PLP, PDP, sizing, stock, filters, product information, calls to action, and merchandising.</p>\n<p>I grouped the findings into themes and considered which issues were most likely to create friction or uncertainty during product discovery and purchase decisions.</p>\n<p>We then prioritised the opportunities based on expected user and business impact, with particular focus on mobile PLP and PDP.</p>", "story": "Huntech", "keywords": ["heuristic evaluation", "friction", "prioritisation", "UI decisions", "conversion", "business impact"], "also_answers": ["CRO", "business impact", "prioritisation", "design process", "product thinking"], "difficulty": "High", "frequency": "Very common"}, {"id": 33, "title": "How did you validate the Huntech solutions?", "tags": ["CASE STUDIES","HUNTECH","UX","ECOMMERCE / CRO"], "body": "<p>The project did not include formal user interviews or A/B testing owned by me, so I would not claim that level of validation.</p>\n<p>The direction was informed by heuristic evaluation, established eCommerce patterns, business knowledge, team feedback, and review with the Design Lead and technical team.</p>\n<p>We also reviewed feasibility and refined the designs through collaboration before handoff.</p>\n<p>With additional time and access, I would validate the highest-risk assumptions through usability testing, behavioural analytics, and controlled experiments where appropriate.</p>", "story": "Huntech", "keywords": ["heuristic evaluation", "friction", "prioritisation", "UI decisions", "conversion", "business impact"], "also_answers": ["CRO", "business impact", "prioritisation", "design process", "product thinking"], "difficulty": "High", "frequency": "Very common"}, {"id": 34, "title": "Why did you prioritise PLP and PDP instead of checkout?", "tags": ["CASE STUDIES","HUNTECH","ECOMMERCE / CRO","PRODUCT"], "body": "<p>The heuristic review identified significant friction earlier in the journey, particularly around product discovery, filtering, sizing, stock, product information, and calls to action.</p>\n<p>If users cannot confidently find and evaluate the right product, fewer of them will reach checkout in the first place.</p>\n<p>PLP and PDP offered a strong combination of user impact, commercial potential, and feasible scope for the project.</p>\n<p>Checkout could still be an important future area, but prioritisation requires focusing on the highest-value opportunity within the available time and constraints.</p>", "story": "Huntech", "keywords": ["heuristic evaluation", "friction", "prioritisation", "UI decisions", "conversion", "business impact"], "also_answers": ["CRO", "business impact", "prioritisation", "design process", "product thinking"], "difficulty": "High", "frequency": "Very common"}, {"id": 35, "title": "Which Huntech design decision are you most proud of?", "tags": ["CASE STUDIES","HUNTECH","UI","ECOMMERCE / CRO"], "body": "<p>I'm particularly proud of the way we reduced uncertainty around product selection on mobile.</p>\n<p>Technical outdoor products often require customers to understand size, stock, features, and suitability before they feel confident purchasing.</p>\n<p>By improving stock visibility, standardising size selection, making the size guide more prominent, clarifying product benefits, and keeping the Add to Cart action accessible, the experience better supported informed purchase decisions.</p>\n<p>It was not one isolated visual change. It was a connected set of UI decisions addressing the same behavioural problem.</p>", "story": "Huntech", "keywords": ["heuristic evaluation", "friction", "prioritisation", "UI decisions", "conversion", "business impact"], "also_answers": ["CRO", "business impact", "prioritisation", "design process", "product thinking"], "difficulty": "High", "frequency": "Very common"}, {"id": 36, "title": "What would you do differently on Huntech with more time?", "tags": ["CASE STUDIES","HUNTECH","UX","ECOMMERCE / CRO"], "body": "<p>I would deepen the validation and measurement stage.</p>\n<p>I would review funnel analytics and behavioural data, test the key mobile flows with representative customers, and establish a clearer baseline for the most important metrics.</p>\n<p>I would then prioritise a small number of high-confidence experiments, such as stock and sizing clarity, sticky Add to Cart behaviour, filtering, or quick add.</p>\n<p>I would also review checkout, accessibility, performance, and post-purchase opportunities to understand where the next improvement cycle should focus.</p>", "story": "Huntech", "keywords": ["heuristic evaluation", "friction", "prioritisation", "UI decisions", "conversion", "business impact"], "also_answers": ["CRO", "business impact", "prioritisation", "design process", "product thinking"], "difficulty": "High", "frequency": "Very common"}, {"id": 37, "title": "How has your design work contributed to business outcomes?", "tags": ["PRODUCT","ECOMMERCE / CRO","CASE STUDIES","HUNTECH","BEHAVIOURAL"], "body": "<p>One example is the Huntech eCommerce project at Blackpepper.</p>\n<p>I conducted a heuristic evaluation of the purchase journey and identified usability issues creating friction across the PLP and PDP.</p>\n<p>Rather than redesigning everything, I prioritised the highest-impact opportunities and translated the findings into practical UI improvements that made product discovery, evaluation, and purchasing clearer.</p>\n<p>The objective was to reduce friction, increase user confidence, and support conversion while balancing user needs, business goals, and technical feasibility.</p>\n<p>The project reinforced how thoughtful design decisions can positively influence both the customer experience and commercial performance.</p>", "story": "Huntech", "keywords": ["heuristic evaluation", "friction", "prioritisation", "UI decisions", "conversion", "business impact"], "also_answers": ["CRO", "business impact", "prioritisation", "design process", "product thinking"], "difficulty": "High", "frequency": "Very common"}, {"id": 38, "title": "How do you collaborate with Product or Project Managers?", "tags": ["STAKEHOLDERS", "PRODUCT"], "body": "<p>I see Product and Project Managers as key partners throughout delivery.</p>\n<p>I work with them to understand the brief, business goals, priorities, scope, dependencies, deadlines, and success criteria before moving too far into design.</p>\n<p>I share ideas early, ask questions, communicate risks, and keep them updated when decisions or constraints affect the timeline or solution.</p>\n<p>My goal is to maintain alignment while contributing design thinking, user perspective, and practical options.</p>", "story": "Blackpepper and Tourism Waitaki collaboration", "keywords": ["alignment", "priorities", "business goals", "communication", "trade-offs"], "also_answers": ["PM collaboration", "stakeholder management", "decision making", "prioritisation"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 39, "title": "How do you communicate design decisions to stakeholders?", "tags": ["STAKEHOLDERS", "PRODUCT", "BEHAVIOURAL"], "body": "<p>I begin by explaining the problem and the evidence before presenting the solution.</p>\n<p>I connect each decision to user needs, business objectives, available insights, brand requirements, or technical feasibility.</p>\n<p>I use prototypes, flows, comparisons, and clear examples to make the reasoning easy to understand.</p>\n<p>I welcome discussion and adapt when new information improves the direction. The goal is shared understanding, not simply approval of my first idea.</p>", "story": "Choose the most relevant: Huntech, Tourism Waitaki, or Store Availability", "keywords": ["situation", "role", "action", "result", "learning"], "also_answers": ["behavioural", "challenge", "adaptability", "communication"], "difficulty": "High", "frequency": "Very common"}, {"id": 40, "title": "How do you collaborate with developers?", "tags": ["DEVELOPERS", "PRODUCT", "UI"], "body": "<p>I involve developers early whenever possible to understand technical constraints, dependencies, and implementation options.</p>\n<p>I prepare organised Figma files, reusable components, responsive behaviour, interaction states, specifications, and supporting notes.</p>\n<p>During development, I remain available to answer questions, review the implementation, and adjust details where needed.</p>\n<p>I see developers as design partners. Strong collaboration usually produces a better and more realistic solution than a one-directional handoff.</p>", "story": "Store Availability / Blackpepper developer collaboration", "keywords": ["technical constraints", "feasibility", "handoff", "trade-offs", "collaboration"], "also_answers": ["developer collaboration", "technical limitations", "communication", "implementation"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 41, "title": "What do you include in a design handoff?", "tags": ["DEVELOPERS", "UI"], "body": "<p>I include organised Figma files, reusable components, responsive layouts, spacing and typography rules, assets, interaction details, and relevant states such as hover, focus, loading, empty, success, and error.</p>\n<p>I add notes where the intended behaviour is not obvious and make sure the developer understands any important priorities or trade-offs.</p>\n<p>I also stay involved during implementation, because handoff is a transition into collaboration rather than the end of the design process.</p>", "story": "Store Availability / Blackpepper developer collaboration", "keywords": ["technical constraints", "feasibility", "handoff", "trade-offs", "collaboration"], "also_answers": ["developer collaboration", "technical limitations", "communication", "implementation"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 42, "title": "How do you know when a design is ready for development?", "tags": ["DEVELOPERS", "UI", "PRODUCT"], "body": "<p>A design is ready when the key problem and scope are understood, the main flows and states are complete, the solution is consistent with the design system, and the intended behaviour is clear.</p>\n<p>I check responsive layouts, accessibility considerations, content, components, edge cases, assets, and annotations.</p>\n<p>I also confirm feasibility and unresolved questions with development before handoff.</p>\n<p>Ready does not mean the design can never change. It means the team has enough clarity and alignment to implement it responsibly.</p>", "story": "Store Availability / Blackpepper developer collaboration", "keywords": ["technical constraints", "feasibility", "handoff", "trade-offs", "collaboration"], "also_answers": ["developer collaboration", "technical limitations", "communication", "implementation"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 43, "title": "Tell me about a technical constraint you faced", "tags": ["DEVELOPERS", "BEHAVIOURAL", "PRODUCT"], "body": "<p>On an eCommerce project, I designed a store availability experience with Delivery, In Store, and Click &amp; Collect options.</p>\n<p>During technical review, the developer explained that the platform could not support real-time store stock at that stage.</p>\n<p>We worked together to define a simpler version that communicated general availability without live store-level information.</p>\n<p>This allowed the team to launch a useful solution within the current constraints, while preserving the original concept for a later platform update.</p>\n<p>The experience reinforced the value of involving developers early and protecting the user's core need even when the ideal implementation is not immediately possible.</p>", "story": "Store Availability / Blackpepper developer collaboration", "keywords": ["technical constraints", "feasibility", "handoff", "trade-offs", "collaboration"], "also_answers": ["developer collaboration", "technical limitations", "communication", "implementation"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 44, "title": "What do you do when requirements or priorities change?", "tags": ["STAKEHOLDERS", "BEHAVIOURAL", "PRODUCT"], "body": "<p>I first clarify what changed, why it changed, and what impact it has on the user, business goal, scope, timeline, and technical solution.</p>\n<p>Then I work with the relevant stakeholders to reprioritise and identify the best feasible response.</p>\n<p>I communicate early if the change creates risk or requires a trade-off, and I update the design and handoff material so the team remains aligned.</p>\n<p>I treat change as a normal part of product delivery, while making sure the consequences are understood rather than absorbed silently.</p>", "story": "Choose the most relevant: Huntech, Tourism Waitaki, or Store Availability", "keywords": ["situation", "role", "action", "result", "learning"], "also_answers": ["behavioural", "challenge", "adaptability", "communication"], "difficulty": "High", "frequency": "Very common"}, {"id": 45, "title": "How do you handle multiple projects and deadlines?", "tags": ["BEHAVIOURAL", "STAKEHOLDERS", "DIGITAL"], "body": "<p>I begin by clarifying priorities, deadlines, dependencies, and business impact.</p>\n<p>I break work into manageable tasks, maintain visibility with the relevant manager or stakeholders, and protect time for focused design work.</p>\n<p>At Blackpepper and Tourism Waitaki, I regularly worked across multiple brands, campaigns, websites, and product initiatives at the same time.</p>\n<p>I stay flexible when priorities change, but I communicate early if quality, scope, or timing may be affected.</p>", "story": "Tourism Waitaki + Blackpepper marketing work", "keywords": ["campaigns", "EDMs", "landing pages", "brand consistency", "stakeholders"], "also_answers": ["digital design", "marketing collaboration", "multiple brands", "campaign delivery"], "difficulty": "Medium", "frequency": "Common"}, {"id": 46, "title": "How do you handle feedback or criticism?", "tags": ["BEHAVIOURAL", "STAKEHOLDERS"], "body": "<p>I treat feedback as part of the design process rather than as a judgement of me personally.</p>\n<p>I listen carefully, clarify the reasoning, and evaluate whether the feedback reveals a user, business, brand, or technical consideration that should change the design.</p>\n<p>I am comfortable defending a decision when there is evidence behind it, but I am equally comfortable changing direction when the new information produces a better outcome.</p>", "story": "Choose the most relevant: Huntech, Tourism Waitaki, or Store Availability", "keywords": ["situation", "role", "action", "result", "learning"], "also_answers": ["behavioural", "challenge", "adaptability", "communication"], "difficulty": "High", "frequency": "Very common"}, {"id": 47, "title": "Describe a difficult task and how you addressed it", "tags": ["BEHAVIOURAL", "PRODUCT"], "body": "<p>One difficult task was improving a complex eCommerce experience without trying to redesign the entire platform.</p>\n<p>I conducted a heuristic evaluation, grouped the findings, and prioritised the areas with the highest potential impact on usability and conversion.</p>\n<p>I then translated those opportunities into practical UI improvements and worked with the wider team to ensure the solutions were feasible and consistent with the design system.</p>\n<p>The challenge taught me that strong design is often about making the right decisions within constraints, not producing the largest possible redesign.</p>", "story": "Choose the most relevant: Huntech, Tourism Waitaki, or Store Availability", "keywords": ["situation", "role", "action", "result", "learning"], "also_answers": ["behavioural", "challenge", "adaptability", "communication"], "difficulty": "High", "frequency": "Very common"}, {"id": 48, "title": "Tell me about a mistake or something you would improve", "tags": ["BEHAVIOURAL", "RECRUITER"], "body": "<p>Earlier in my transition into product design, I sometimes tried to explain too much of the process at once rather than adapting the level of detail to the audience.</p>\n<p>I learned that a stakeholder, developer, recruiter, and design leader each need a different level of context.</p>\n<p>Now I lead with the problem, the decision, and the impact, and then provide more detail only where it is useful.</p>\n<p>That has made my communication clearer and more effective.</p>", "story": "Choose the most relevant: Huntech, Tourism Waitaki, or Store Availability", "keywords": ["situation", "role", "action", "result", "learning"], "also_answers": ["behavioural", "challenge", "adaptability", "communication"], "difficulty": "High", "frequency": "Very common"}, {"id": 49, "title": "What are your main strengths?", "tags": ["RECRUITER", "COMPANY"], "body": "<p>My main strength is connecting strong visual design with business and technical thinking.</p>\n<p>I can move between product interfaces, eCommerce, design systems, websites, landing pages, EDMs, campaigns, and brand communications without losing sight of consistency or the customer journey.</p>\n<p>I am also comfortable working autonomously, collaborating across disciplines, and translating complex requirements into clear, practical solutions.</p>", "story": "Company-specific preparation", "keywords": ["company research", "role fit", "product", "business challenge", "relevant experience"], "also_answers": ["why us", "why this role", "company knowledge", "first 90 days"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 50, "title": "What is an area you want to develop?", "tags": ["RECRUITER", "UX", "ECOMMERCE / CRO"], "body": "<p>I want to deepen my practical experience in formal experimentation and research activities such as A/B testing, behavioural analytics, heatmap analysis, and direct user testing.</p>\n<p>I already understand how those methods fit into the process and have strong hands-on experience applying UX principles, heuristic evaluation, and available insights to design decisions.</p>\n<p>Developing greater ownership of experimentation would be a natural next step, particularly because I want to continue growing in eCommerce and CRO.</p>", "story": "Blackpepper + Huntech", "keywords": ["conversion", "cart abandonment", "AOV", "friction", "commercial outcomes"], "also_answers": ["eCommerce", "CRO", "metrics", "business outcomes"], "difficulty": "Medium", "frequency": "Common"}, {"id": 51, "title": "What would you do in your first few weeks?", "tags": ["COMPANY", "PRODUCT", "STAKEHOLDERS"], "body": "<p>My first priority would be to learn before proposing major changes.</p>\n<p>I would understand the product or service, users, business model, current priorities, team structure, design system, technical environment, delivery process, and available evidence.</p>\n<p>I would meet the people I would work with most closely and clarify how success is measured.</p>\n<p>Once I had enough context, I would identify a small number of opportunities where I could contribute quickly while building toward larger improvements.</p>", "story": "Company-specific preparation", "keywords": ["company research", "role fit", "product", "business challenge", "relevant experience"], "also_answers": ["why us", "why this role", "company knowledge", "first 90 days"], "difficulty": "Medium", "frequency": "Very common"}, {"id": 52, "title": "Do you have questions for us?", "tags": ["COMPANY", "RECRUITER", "STAKEHOLDERS"], "body": "<div class=\"minihead\">Role and success</div>\n<p>What would success look like in this role during the first six to twelve months?</p>\n<p>What are the most important problems you would like this person to help solve?</p>\n<div class=\"minihead\">Team and process</div>\n<p>How is the team structured, and who would I work with most closely?</p>\n<p>How are design opportunities identified, prioritised, and measured?</p>\n<p>How closely does design work with development, product, and marketing during implementation?</p>\n<div class=\"minihead\">Product and business</div>\n<p>Where do you currently see the greatest friction or opportunity in the customer journey?</p>\n<p>What excites you most about the product or company over the next few years?</p>\n<div class=\"minihead\">Practical</div>\n<p>What are the next steps in the hiring process?</p>", "story": "Company-specific preparation", "keywords": ["company research", "role fit", "product", "business challenge", "relevant experience"], "also_answers": ["why us", "why this role", "company knowledge", "first 90 days"], "difficulty": "Medium", "frequency": "Very common"}];

function stripHtml(html){const d=document.createElement('div');d.innerHTML=html;return d.textContent||d.innerText||'';}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function orderIndex(list,title){const n=norm(title);const idx=list.findIndex(t=>n===t||n.includes(t)||t.includes(n));return idx===-1?999:idx;}

function tagClass(t){return 'tag-'+t.toLowerCase().replace(/\s*\/\s*/g,'-').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function cardTags(q){const prefer=['RECRUITER','UI','PRODUCT','PM','DEV','MARKETING','CRO / ECOMMERCE','COMPANY','KIWIPLATES','HUNTECH','ENTAIN'];const out=[];prefer.forEach(t=>{if(q.tags.includes(t)&&!out.includes(t))out.push(t)});return out.map(t=>`<span class="tag-badge ${tagClass(t)}">${t}</span>`).join('');}
const keyTerms=[
'Project Managers','Project Manager','Senior Developer','developers','developer','Marketing team','Marketing','stakeholders','business goals','user needs','technical constraints','requirements','priorities','deadlines','brief','handoff','implementation','Figma files','Figma','components','Design Systems','Component Libraries','Brand Guidelines','wireframes','prototype','prototypes','responsive layouts','hover','error','loading','HTML','CSS','CRO','Conversion Rate','Cart Abandonment','Average Order Value','AOV','eCommerce','checkout','purchase journey','PLP','PDP','Shopify','Heuristic Analysis','UX Audit','user behaviour','friction points','technical limitation','technically feasible','design decisions','Sole Designer','KiwiPlates','Entain','Huntech','Blackpepper','Tourism Waitaki','EDMs','delivery','Click & Collect','In Store','stock','salary','Permanent Resident','start','right to work','business impact','trade-offs','current constraints'
].sort((a,b)=>b.length-a.length);
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function highlightTextNode(node){let text=node.nodeValue;let frag=document.createDocumentFragment();let re=new RegExp('\\b('+keyTerms.map(escapeRegExp).join('|')+')\\b','gi');let last=0, m;while((m=re.exec(text))){if(m.index>last)frag.appendChild(document.createTextNode(text.slice(last,m.index)));let span=document.createElement('span');span.className='hl-key';span.textContent=m[0];frag.appendChild(span);last=m.index+m[0].length;}if(last===0)return;if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));node.parentNode.replaceChild(frag,node);}
function highlightElement(el){const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode(node){if(!node.nodeValue.trim())return NodeFilter.FILTER_REJECT;let p=node.parentElement;while(p){if(['SCRIPT','STYLE','A'].includes(p.tagName)||p.classList?.contains('tag-badge')||p.classList?.contains('hl-key'))return NodeFilter.FILTER_REJECT;p=p.parentElement;}return NodeFilter.FILTER_ACCEPT;}});const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(highlightTextNode);}
function matches(q){const inFilter=active==='ALL'||q.tags.includes(active);const text=(q.title+' '+q.tags.join(' ')+' '+stripHtml(q.body)).toLowerCase();const inSearch=!query||text.includes(query.toLowerCase());return inFilter&&inSearch;}

function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function chips(items){return (items||[]).map(x=>`<span class="study-chip">${esc(x)}</span>`).join('');}
function studyMeta(q){return ``;}

function createCard(q,index){const card=document.createElement('article');card.className='card';card.innerHTML=`<button class="card-btn" type="button"><div class="num">${String(index).padStart(2,'0')}</div><div class="title"></div><div class="tags">${cardTags(q)} <span class="chev">⌄</span></div></button><div class="body">${q.body}</div>`;card.querySelector('.title').textContent=q.title;highlightElement(card.querySelector('.title'));highlightElement(card.querySelector('.body'));card.querySelector('.card-btn').addEventListener('click',()=>card.classList.toggle('open'));return card;}
function titleNode(text){const d=document.createElement('div');d.className='group-title';d.textContent=text;return d;}
function render(){
document.body.classList.remove('kiwi-mode');
contentEl.innerHTML='';
let filtered=questions.filter(matches);
filtered.sort((a,b)=>a.id-b.id).forEach((q,i)=>contentEl.appendChild(createCard(q,i+1)));
countEl.textContent=filtered.length;
emptyEl.style.display=filtered.length?'none':'block';
}
filters.forEach(f=>{const b=document.createElement('button');b.className='filter'+(f==='ALL'?' active':'');b.textContent=f;b.onclick=()=>{active=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};filtersEl.appendChild(b);});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();render()});render();
</script></body></html>
