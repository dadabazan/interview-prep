<script>
const questions = [{"id": 1, "title": "Tell me about yourself and your experience", "title_html": "Tell me about <mark>yourself and your experience</mark>", "body": "<p>I'm Dario, originally from Argentina. I have a degree in Graphic Design, which gave me a strong visual foundation. I've worked as a designer for many years across different environments, including startups, digital agencies, and public organisations.</p><p>In New Zealand, my first role was with Tourism Waitaki, where I worked for three and a half years as the sole designer. There I was responsible for the visual communication across its brands and sub-brands, designing websites, landing pages, digital and print advertising, EDMs, and marketing campaigns.</p><p>When I obtained my PR, I moved to Auckland and joined Blackpepper, a specialist eCommerce agency and partner of Google, Meta, and Shopify, where I worked as a UI &amp; Digital Designer, designing eCommerce websites and apps for brands such as Starbucks, Glassons, Hallenstein, and Torpedo7, with a strong focus on CRO.</p><p>I was part of a multidisciplinary team, collaborating closely with developers, project managers, marketing teams, and other designers.</p><p>Now I'm looking for my next challenge, where I can continue growing as a designer while bringing my experience in Product and Digital Design, eCommerce, and visual design.</p>", "priority": true, "digitas_rank": 1}, {"id": 2, "title": "Why are you looking for a new role?", "title_html": "Why are you looking for <mark>a new role?</mark>", "body": "<p>My previous company, Blackpepper, went through a restructure after losing some major clients, and my role was made redundant.</p><p>It was a business decision. I left on very good terms and have a good relationship with the team and the company. I'm also happy to provide references if needed.</p><p>I really enjoyed my time there, and now I'm ready for my next step and looking for an opportunity where I can continue growing as a designer.</p>", "priority": false, "digitas_rank": null}, {"id": 3, "title": "Why do you want to work here? Why should we hire you? Why do you think you're a good fit for this role?", "title_html": "Why do you <mark>want to work here</mark>? Why should we <mark>hire you</mark>? Why do you think you're a <mark>good fit for this role</mark>?", "body": "<p>I'm looking for a place where <strong>design, business, and technology work together.</strong></p>\n<p>Digitas really interests me because the role combines different types of digital work — digital experiences, CRM, websites, EDMs, and campaigns. <strong>That's a strong match for my experience in digital design, eCommerce, CRO, and digital campaigns.</strong></p>\n<p>I also like the variety of projects and clients. I saw that Digitas works with well-known brands such as Toyota, McDonald's, Vero, and Z Energy, and I think that kind of variety would be really interesting for me.</p>\n<p>I also like that Digitas is part of <strong>Publicis Groupe</strong>, a large global network. I'm interested in the opportunity to work and learn with talented people and continue developing my skills.</p>\n<p>Finally, I like that AI is an important part of how Digitas is thinking about the future of digital design. <strong>I recently read an article</strong> by Chris about AI and content, and I found his perspective really interesting. <a href='http://lbbonline.com' target='_blank' rel='noopener'>lbbonline.com</a></p>\n<p><strong>Overall, I think my experience is a strong fit for the role. I can bring experience across digital design, eCommerce, CRO, and campaigns, while continuing to grow as a designer.</strong></p>", "priority": true, "digitas_rank": 5}, {"id": 4, "title": "How do you use AI in your design process? / How do you think AI will change the role of designers?", "title_html": "How do you use <mark>AI in your design process</mark>? / How do you think <mark>AI will change the role of designers</mark>?", "body": "<p>I use AI a lot in different parts of my design process, but I always use my own design judgment to make the final decisions.</p><p>For example, <strong>at Blackpepper, we used ChatGPT to analyse customer reviews for Glassons and find patterns.</strong> It helped us understand a lot of customer feedback much faster than doing it manually.</p><p>I also use AI to <strong>analyse briefs, explore ideas, generate images, and compare different design directions.</strong></p><p>I use tools like <strong>Figma Make and Relume</strong> for flows, wireframes, and prototypes, and I use <strong>Claude with existing design systems</strong> to create assets faster and keep the design consistent.</p><p>I also use AI to review my work, for example, for accessibility or basic usability issues.</p><p><strong>So overall, AI helps me work faster and explore more options, but I make the final design decisions.</strong></p><p>I think AI will become an important skill for designers. It's a kind of superpower, but we still need our own design judgment.</p>", "priority": true, "digitas_rank": 6}, {"id": 5, "title": "What are your strengths?", "title_html": "What are your strengths?", "body": "<p>My main strengths are my strong visual design skills, my ability to solve problems through design, and my focus on results.</p><p>I care about understanding the problem, the user needs, and the business goals, not just the visual outcome.</p><p>I'm also curious by nature, and I'm always looking for new ways to learn and improve my work.</p>", "priority": false, "digitas_rank": null}, {"id": 6, "title": "What is a weakness or area you'd like to improve?", "title_html": "What is a weakness or <mark>area you'd like to improve?</mark>", "body": "<p>One area I'm working on is becoming more confident when presenting and explaining my design work in English. I can communicate my ideas clearly, but I want to become more confident and natural when presenting to clients and stakeholders.</p><p>I'm actively working on improving my English and becoming more confident in these situations.</p>", "priority": false, "digitas_rank": null}, {"id": 7, "title": "What would you like to develop or learn?", "title_html": "What would you like to <mark>develop or learn?</mark>", "body": "<p>I already use UX principles, heuristic evaluation, and available insights to support my design decisions, but one area I'd like to develop is research, particularly A/B testing, heatmaps, user behaviour data, and user testing.</p><p>I think this will help me make better design decisions based on data.</p>", "priority": false, "digitas_rank": null}, {"id": 8, "title": "How do you approach your brief / design process / workflow / customer journey?", "title_html": "How do you approach your <mark>brief / design process / workflow / customer journey</mark>?", "body": "<p><em>(Rol: Product Designer / UX-UI)</em></p>\n<p><em>Brief → customer journey → evidence → prioritise → wireframes/UI → design system → developers/stakeholders → handoff → post-launch</em></p>\n<p>My process changes a bit depending on the project, but I follow a consistent structure.</p>\n<p>First, I make sure I understand the brief — <strong>the user needs, business goals, success criteria, and technical constraints.</strong> If something isn't clear, I prefer to ask questions early rather than assume.</p>\n<p>Then I look at the <strong>customer journey</strong> and review any available evidence, such as analytics, customer feedback, or a heuristic evaluation. <strong>This helps me understand the main problems and where I need to focus.</strong></p>\n<p>From there, I explore solutions through <strong>wireframes, UI, and prototypes</strong>, while following the existing design system.</p>\n<p>I work closely with <strong>developers and stakeholders throughout the process</strong>, not just at the end, so we can make sure the design is realistic to build. Then I prepare the handoff and, after launch, use available data to look for further improvements.</p>\n<p><strong>So overall: understand the problem, use evidence to prioritise, design within the system, and collaborate with the team from start to finish.</strong></p>\n<p>Foco: tu proceso completo de diseño, desde el brief hasta después del lanzamiento.</p>", "priority": true, "digitas_rank": 2}, {"id": 9, "title": "How do you approach generating creative concepts for a project?", "title_html": "How do you approach <mark>generating creative concepts</mark> for a project?", "body": "<p><a href='https://vaulted-primula-86d.notion.site/It-s-Famous-because-It-s-Good-790782e3dd844b05bbfda4afe744dc50' target='_blank' rel='noopener'>It's Famous because It's Good — case study</a></p>\n<p><em>(Rol: Digital Designer / agencia)</em></p>\n<p><em>Brief → research → explore directions → evaluate → validate → develop → launch → learn → iterate</em></p>\n<p>My approach usually starts with the <strong>brief, the user needs, and the business goals</strong>. I also consider the audience, the key message, the timeline, and any technical or production constraints.</p>\n<p>Then I do research and look at the brand, the market, competitors, and relevant references to understand the context and identify opportunities.</p>\n<p>From there, I <strong>explore different creative directions</strong> instead of choosing one idea too quickly. I discuss them with my manager and the team, and evaluate which direction is strongest based on the audience, the business goal, how distinctive it is, and how realistic it is to execute.</p>\n<p>Once we agree on a direction, I develop the <strong>concept and visual identity</strong>, and think about how it can work consistently across different channels and formats.</p>\n<p><strong>After launch,</strong> when data or feedback is available, I look at what worked and what we can improve, and use those learnings for future campaigns.</p>\n<p><strong>For me, creative design is not just about coming up with an idea. It's about exploring possibilities, choosing the strongest direction, and turning it into a strong, effective, and consistent campaign.</strong></p>\n<p>Foco: tu pensamiento creativo, cómo pasás de un brief a una dirección conceptual y después a una campaña completa.</p>", "priority": true, "digitas_rank": 3}, {"id": 10, "title": "Tell me about a project you are particularly proud of. / Tell me about a time you improved conversion.", "title_html": "Tell me about a <mark>project you are particularly proud of</mark>. / Tell me about a time you <mark>improved conversion</mark>.", "body": "<p>⭐ Huntech – Short Version (60–90 sec) Huntech is a New Zealand outdoor retailer specialising in technical hunting gear and equipment. However, its eCommerce experience was no longer keeping up with the needs of the business, and there were several opportunities to improve the shopping experience and conversion.</p>\n<p>My role was to lead the UI redesign, working within a multidisciplinary team under our Design Lead. Before designing, I conducted a heuristic analysis to understand where we could create the biggest impact. We focused on the Product Listing Page and Product Detail Page, where customers compare products and make purchase decisions.</p>\n<p>I grouped the findings into three areas: Usability, Comprehension, and Merchandising, and translated them into five key design improvements, including stock and size visibility, product discovery, mobile filtering, product information, and shopping efficiency. I also contributed to the Design System and prepared the designs for developer handoff. After launch, Blackpepper reported a 125% increase in revenue and a 41% increase in Average Order Value. While many factors can influence these results, the project showed me how thoughtful UI design can reduce uncertainty, improve the customer experience, and support business goals.</p>\n<p>⭐ Huntech - Long Version (3–5 min)</p>\n<p>Para presentar el case study completo, mientras compartís pantalla y recorres el portfolio con el entrevistador.</p>\n<p>Huntech is a New Zealand outdoor retailer specialising in technical hunting gear and equipment.</p>\n<p>However, its eCommerce experience was no longer keeping up with the needs of the business. The platform had several limitations that affected the shopping experience and created opportunities to improve conversion.</p>\n<p>My Role</p>\n<p>My role was to lead the UI redesign, working within a multidisciplinary team under our Design Lead.</p>\n<p>I was responsible for identifying key usability issues, translating findings into practical UI solutions, contributing to the Design System, and preparing the designs for developer handoff.</p>\n<p>Audit &amp; Diagnosis</p>\n<p>Before designing, I wanted to understand where we could create the biggest impact. I conducted a heuristic analysis across the purchase journey to identify friction points affecting both the user experience and business goals. The review uncovered opportunities around Usability, Comprehension, and Merchandising.</p>\n<p>Rather than redesigning the entire website, we focused on the Product Listing Page and Product Detail Page because that's where customers compare products and make purchase decisions.</p>\n<p>The goal was to reduce purchase uncertainty and help users make decisions with greater confidence.</p>\n<p>Design Decisions</p>\n<p>From the findings, I prioritised the highest-impact opportunities and translated them into five key design decisions.</p>\n<p>1. The first was Product Confidence.</p>\n<p>Users couldn't always see stock availability, sizing was inconsistent, and the Size Guide wasn't very visible.</p>\n<p>I introduced real-time stock visibility, standardised sizing patterns, and a more visible Size Guide to reduce uncertainty around size and stock.</p>\n<p>2. The second was Product Discovery.</p>\n<p>The mobile navigation was unclear, search had no guidance, and the category structure was too text-heavy.</p>\n<p>I introduced a clearer navigation structure, guided search, and visual category tiles to help users find products faster and reduce uncertainty. 3. The third was Mobile Filtering.</p>\n<p>The filtering experience required multiple steps, there was no sorting option, and some touch targets were too small on mobile.</p>\n<p>I combined filtering and sorting into one flow and introduced larger, touch-safe controls to make the experience easier to use on mobile.</p>\n<p>4. The fourth was Product Communication.</p>\n<p>Important product benefits were mainly explained through text, and the Add to Cart button wasn't always visible.</p>\n<p>I introduced visual icons for key product benefits and a sticky Add to Cart button to make product information clearer and keep the purchase action visible.</p>\n<p>5. The last was Shopping Efficiency.</p>\n<p>Users had to open the product page before adding an item to the cart, and product cards were inconsistent.</p>\n<p>I introduced Quick Add directly from the Product Listing Page and made the product cards more consistent, helping users shop more efficiently.</p>\n<p>Design System &amp; Delivery</p>\n<p>Alongside the redesign, I also worked within the existing Design System, adapting and expanding components to support Huntech's specific needs and create a more consistent purchase experience.</p>\n<p>I documented the final designs in Figma and prepared them for developer handoff. Impact</p>\n<p>After launch, Blackpepper reported a 125% increase in revenue and a 41% increase in Average Order Value.</p>\n<p>While many factors can influence business performance, these results suggest that reducing uncertainty and improving the purchase experience can contribute to stronger commercial outcomes.</p>\n<p>Reflection</p>\n<p>The biggest lesson for me from this project was that reducing uncertainty doesn't always mean simplifying the interface.</p>\n<p>Users needed confidence that the size was available, the product was right for them, and it was worth the price.</p>\n<p>For me, this project showed how thoughtful UI design can support purchase decisions while balancing user needs and business goals.</p>", "priority": true, "digitas_rank": 4}, {"id": 11, "title": "How do you balance user needs, business goals, and technical constraints?", "title_html": "How do you <mark>balance user needs, business goals, and technical constraints</mark>?", "body": "<p>I believe the best solutions create value for everyone.</p>\n<p>Before making design decisions, I try to understand the user needs, the business goals, and any technical constraints.</p>\n<p>Sometimes there are trade-offs, so I work with the team to find the best balance. In Huntech, for example, we focused on reducing purchase uncertainty while also improving the shopping experience and supporting conversion.</p>\n<p>My goal is to create a solution that works well for the user, supports the business goals, and is realistic to build. \"Trade-off\" significa una situación donde para ganar algo, tenés que ceder algo a cambio — no podés tener las dos cosas al 100%.</p>", "priority": true, "digitas_rank": 7}, {"id": 12, "title": "How do you communicate design decisions to stakeholders?", "title_html": "How do you <mark>communicate design decisions to stakeholders</mark>?", "body": "<p>I start by explaining the problem before presenting the solution. Then I explain how my design decisions support the user needs, the business goals, and any technical constraints or available insights.</p>\n<p>I like to use wireframes, prototypes, flows, or simple examples to make the reasoning easy to understand. I also like to share ideas early and create space for discussion, because stakeholders can bring useful context that I may not have.</p>\n<p>My goal is to make the reasoning clear, get everyone aligned, and find the best solution together.</p>", "priority": true, "digitas_rank": 8}, {"id": 13, "title": "How do you handle feedback or criticism?", "title_html": "How do you <mark>handle feedback or criticism</mark>?", "body": "<p>I see feedback as an important part of the design process. First, I try to understand the reason behind the feedback and if there is something I didn't consider.</p>\n<p>I listen carefully, ask questions when needed, and if the feedback brings new information or improves the solution, I'm happy to adapt the design. If I have a different view, I explain my reasoning and discuss it with the team.</p>\n<p>I try to put my ego aside and focus on making the work better. At the end of the day, we all share the same goal: creating the best possible outcome for the user and the business.</p>", "priority": true, "digitas_rank": 9}, {"id": 14, "title": "How do you handle it when a stakeholder or client pushes back on a creative decision you believe in?", "title_html": "How do you handle it <mark>when a stakeholder or client pushes back on a creative decision you believe in?</mark>", "body": "<p>First, I listen and try to understand why they have concerns.</p>\n<p>Then I explain the thinking behind the decision and connect it to the brief, the users, the brand, or the business goal.</p>\n<p>If I learn something new from their feedback, I'm happy to change the idea. If I still believe my solution is stronger, I'll explain why and use prototypes or examples to show my thinking.</p>\n<p>For me, it's about working together to find the best solution for the users and the business.</p>", "priority": false, "digitas_rank": null}, {"id": 15, "title": "How do you work with copywriters and content teams?", "title_html": "How do you work with <mark>copywriters and content teams?</mark>", "body": "<p>I have experience working closely with copywriters and content teams across both Tourism Waitaki and Blackpepper.</p>\n<p>At Tourism Waitaki, I worked with a colleague responsible for campaign copy, blog content, and other communications.</p>\n<p>At Blackpepper, I worked closely with the SEO team, who provided copy for websites, blog content, EDMs, and other digital projects.</p>\n<p>I worked with them to make sure the content and design worked well together. I think involving content teams early creates a stronger overall experience.</p>", "priority": false, "digitas_rank": null}, {"id": 16, "title": "How do you collaborate with developers?", "title_html": "How do you collaborate with <mark>developers?</mark>", "body": "<p>I like to work closely with developers throughout the project, not just at the end. I involve them early to understand any technical constraints and discuss what is realistic to build.</p>\n<p>During the project, I prepare clean and organised Figma files with reusable components, different states, and clear documentation. I also add notes or examples when needed to make the design intent clear.</p>\n<p>I also have a basic understanding of HTML and CSS, which helps me communicate with developers and understand what is feasible to build.</p>\n<p>During implementation, I stay available to answer questions, review the work, and discuss any issues with developers to find the best solution.</p>", "priority": true, "digitas_rank": null}, {"id": 17, "title": "What do you include in a design handoff?", "title_html": "What do you include in <mark>a design handoff?</mark>", "body": "<p>I make sure my Figma files are clean, organised, and ready for development.</p>\n<p>I include reusable components, layouts for different screen sizes, typography, spacing, colours, assets, and different states such as hover, loading, success, and error.</p>\n<p>When something isn't obvious, I add notes, examples, or documentation to make the design intent clear and reduce questions during development.</p>\n<p>I also stay available during implementation to answer questions, review the final build, and work with developers if any adjustments are needed.</p>", "priority": false, "digitas_rank": null}, {"id": 18, "title": "How do you use Design Systems or Libraries and component libraries?", "title_html": "How do you use Design <mark>Systems or component libraries?</mark>", "body": "<p>At Blackpepper, I helped maintain design systems for multiple eCommerce clients — adding new components, improving existing ones, and making sure everything stayed consistent and scalable. I worked in Figma using shared libraries, variants, auto layout, and design tokens for things like colour, typography, and spacing.</p>\n<p>I believe a good design system is valuable because it helps teams work faster, maintain consistency, and reduce mistakes, especially when working across multiple brands.</p>", "priority": false, "digitas_rank": null}, {"id": 19, "title": "How do you manage/handle multiple projects, priorities and deadlines?", "title_html": "How do you manage/handle multiple <mark>projects, priorities and deadlines?</mark>", "body": "<p>I handle multiple projects by staying organised and communicating clearly.</p>\n<p>Before starting any project, I make sure I understand the brief, the priorities, the deadlines, and the business goals.</p>\n<p>I prioritise my work based on discussions with the Project Manager, business impact, and deadlines.</p>\n<p>At Blackpepper and Tourism Waitaki, I regularly managed multiple projects at the same time, working across different brands and teams, so I'm comfortable managing different priorities.</p>\n<p>If priorities change, I communicate early and work with the team to find the best solution.</p>", "priority": true, "digitas_rank": null}, {"id": 20, "title": "How do you measure if a design is successful?", "title_html": "How do you measure if <mark>a design is successful?</mark>", "body": "<p>For me, success means improving both UX and business outcomes.</p>\n<p>I look at how the design reduces friction, brings clarity, and helps users complete their tasks.</p>\n<p>In eCommerce, relevant metrics include Conversion Rate, Cart Abandonment, and Average Order Value. In marketing and digital projects, I look at engagement, how clearly the message is communicated, and brand consistency across channels.</p>\n<p>In UX/UI, I also pay attention to qualitative feedback — if the experience feels clear and easy to use, even when there isn't hard data available.</p>\n<p>I haven't always tracked the metrics myself, but I design with those goals in mind and use available team data to inform and improve my work.</p>", "priority": false, "digitas_rank": null}, {"id": 21, "title": "Do you have experience with UX research, A/B testing, heatmaps, or journey maps?", "title_html": "Do you have experience with <mark>UX research, A/B testing, heatmaps, or journey maps?</mark>", "body": "<p>I studied UX/UI formally, so I understand methods such as A/B testing, heatmaps, and journey mapping. In my previous roles, that side was usually handled by someone else on the team, such as a Design Lead or research specialist.</p><p>My role was to take the available data and insights and turn them into design decisions. I also use UX principles and heuristic evaluation to review and improve digital experiences.</p><p>At Blackpepper, working in a CRO-focused eCommerce agency helped me develop this approach. Metrics such as conversion rate, cart abandonment, and Average Order Value were part of how I thought about design.</p><p>I haven't had many opportunities to apply these methods in my professional work, so I'd like to get more practical experience and continue developing these skills.</p>", "priority": true, "digitas_rank": null}, {"id": 22, "title": "Tell me about your digital marketing experience?", "title_html": "Tell me about your <mark>digital marketing experience</mark>?", "body": "<p>I've worked closely with marketing teams throughout my career.</p><p>At Tourism Waitaki, I supported digital campaigns for our main brand and sub-brands, such as Tourism Waitaki, Alps 2 Ocean, and the Oamaru Blue Penguin Colony.</p><p>I worked across different channels, including social media, websites, landing pages, EDMs, digital assets, banners, and other campaign materials.</p><p>At Blackpepper, I did similar work for our own brands and also for different clients, adapting the design to their brand, audience, and campaign goals.</p><p>I usually worked from marketing briefs and helped translate the message and campaign goals into clear visual communication across different channels.</p>", "priority": false, "digitas_rank": 10}, {"id": 23, "title": "Tell me about your EDM experience?", "title_html": "Tell me about your <mark>EDM experience</mark>?", "body": "<p>I've worked with EDMs throughout my career.</p><p>At Tourism Waitaki, I designed regular EDMs for Tourism Waitaki and its sub-brands, such as Alps 2 Ocean and the Oamaru Blue Penguin Colony.</p><p>At Blackpepper, I also worked on EDMs for our own company and for CODY, our technology platform, including company and product updates. I also designed EDMs for clients such as Torpedo7 and King Plant Barn.</p><p>For King Plant Barn, for example, I worked on different types of customer communications for members and non-members, including birthday emails, abandoned carts, back-in-stock emails, promotions, and other marketing campaigns.</p><p>So I've worked with different audiences and types of email communications, and I understand that the design needs to support both the message and the goal of each communication.</p>", "priority": false, "digitas_rank": 11}, {"id": 24, "title": "Do you have experience with Lifecycle Marketing?", "title_html": "Do you have experience with <mark>Lifecycle Marketing</mark>?", "body": "<p>Yes, mainly through my work with EDMs and customer communications.</p><p>At Blackpepper, I designed different types of EDMs for clients such as King Plant Barn, including birthday emails, abandoned carts, back-in-stock emails, promotions, and member communications.</p><p>I worked with different audiences and types of customer communications, making sure the design supported the message and the goal of each communication.</p>", "priority": false, "digitas_rank": 12}, {"id": 25, "title": "Tell me about your eCommerce experience.", "title_html": "Tell me about your eCommerce <mark>experience.</mark>", "body": "<p>My strongest eCommerce experience comes from Blackpepper, a specialist eCommerce agency and partner of Google, Meta, and Shopify.</p>\n<p>I worked on eCommerce websites and apps for major brands such as Starbucks, Glassons, Hallenstein, and Torpedo7, with a strong focus on CRO and improving the customer experience and business outcomes.</p>\n<p>Working in an agency environment also gave me the opportunity to work across different brands, projects, and business needs, while collaborating closely with developers, project managers, and other designers.</p>", "priority": false, "digitas_rank": null}, {"id": 26, "title": "Tell me about your Shopify experience?", "title_html": "Tell me about your Shopify <mark>experience?</mark>", "body": "<p>I have limited direct experience with Shopify.</p>\n<p>Blackpepper became a certified Shopify partner relatively recently, close to when my role ended, so I didn't have much opportunity to work directly with the platform. However, I have strong eCommerce experience from working at Blackpepper, a specialist eCommerce agency and partner of Google, Meta, and Shopify.</p>\n<p>I worked on eCommerce websites and apps for brands such as Starbucks, Glassons, Hallenstein, and Torpedo7, with a strong focus on CRO and the customer experience.</p>\n<p>So while my direct Shopify experience is limited, I have a strong understanding of eCommerce design and I'm confident I can learn the platform quickly.</p>", "priority": false, "digitas_rank": null}, {"id": 27, "title": "Tell me about your experience with motion graphics or animation.", "title_html": "Tell me about your experience <mark>with motion graphics or animation.</mark>", "body": "<p>I have some experience with motion graphics and animation.</p>\n<p>A while ago, I took an After Effects course and have also created simple animations in Figma and Framer.</p>\n<p>Motion hasn't been a major part of my previous roles, so it's not my strongest skill yet. However, I'd like to develop this skill and explore how motion can improve digital experiences.</p>", "priority": false, "digitas_rank": null}, {"id": 28, "title": "How do you work autonomously or as a sole designer?", "title_html": "How do you work autonomously <mark>or as a sole designer?</mark>", "body": "<p>I feel completely comfortable working autonomously because I've done it before.</p>\n<p>At Tourism Waitaki, I was the sole designer for the region, managing projects from start to finish.</p>\n<p>I really enjoy the autonomy and responsibility that comes with the role, but I also know when to ask questions, share ideas, or involve the team when needed.</p>", "priority": false, "digitas_rank": null}, {"id": 29, "title": "Do you have questions for us?", "title_html": "Do you have questions for <mark>us?</mark>", "body": "<p>1. What kind of work would I be doing most of the time? How would you describe the balance between campaigns and CRM, and websites, apps, and digital experiences? 2. What are you looking for this person to bring to the team? 3. How do you see this role developing over time, in terms of responsibilities and the type of work I could take on? 4. How is the design team structured, and who would I work with most closely? 5. What are the next steps in the process?</p>", "priority": false, "digitas_rank": null}];
const filtersEl=document.getElementById("filters");
const contentEl=document.getElementById("content");
const countEl=document.getElementById("count");
const searchEl=document.getElementById("search");
const clearSearchEl=document.getElementById("search-clear");
const emptyEl=document.getElementById("empty");
let activeFilter="ALL";

function renderFilters(){
  const fs=[["ALL","ALL"],["PRIORITY","PRIORITY"],["REST","REST"],["DIGITAS","DIGITAS"]];
  filtersEl.innerHTML=fs.map(([k,v])=>`<button class="filter ${k===activeFilter?"active":""}" data-filter="${k}">${v}</button>`).join("");
  filtersEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;renderFilters();render();});
}

function render(){
  const term=searchEl.value.trim().toLowerCase();
  clearSearchEl.style.display=term?"block":"none";
  let list=questions.filter(q=>{
    const filterOk=
      activeFilter==="ALL" ||
      (activeFilter==="DIGITAS" && q.digitas_rank) ||
      (activeFilter==="PRIORITY" && q.priority) ||
      (activeFilter==="REST" && !q.priority);
    const hay=(q.title+" "+q.body).toLowerCase();
    return filterOk && (!term || hay.includes(term));
  });
  if(activeFilter==="DIGITAS") list.sort((a,b)=>a.digitas_rank-b.digitas_rank);
  contentEl.innerHTML=list.map(q=>`
    <article class="card">
      <button class="card-btn" type="button">
        <div class="num">${q.id}</div>
        <div class="title">${q.title_html}</div>
        <div class="tags">${activeFilter==="DIGITAS" ? "DIGITAS #"+q.digitas_rank : (q.priority?"PRIORITY":"REST")}</div>
        <span class="chev">⌄</span>
      </button>
      <div class="body">${q.body}</div>
    </article>`).join("");
  countEl.textContent=list.length;
  emptyEl.style.display=list.length?"none":"block";
  contentEl.querySelectorAll(".card-btn").forEach(b=>b.onclick=()=>b.closest(".card").classList.toggle("open"));
}

searchEl.addEventListener("input",render);
clearSearchEl.addEventListener("click",()=>{searchEl.value="";searchEl.focus();render();});
renderFilters();
render();
</script>
</body>
</html>
