<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digitas Interview Playbook</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--text:#20201e;--muted:#77756f;--border:#e5e3df;--green:#1f5f2b;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrapper{max-width:1050px;margin:auto;padding:28px 18px 70px}
h1{margin:0 0 5px;font-size:32px;letter-spacing:-.03em}
.subtitle{color:var(--muted);margin-bottom:20px}
.controls{position:sticky;top:0;z-index:10;background:rgba(250,250,248,.95);backdrop-filter:blur(12px);padding:10px 0 16px}
.panel{background:white;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 5px 18px rgba(0,0,0,.035)}
#search{width:100%;padding:13px 15px;border:1px solid var(--border);border-radius:12px;font-size:16px;margin-bottom:12px}
.filter-group{display:flex;gap:8px;flex-wrap:wrap}
.filter{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;font-weight:750;cursor:pointer}
.filter.active{border-color:var(--green);background:#edf7ef;color:var(--green)}
.counter{color:var(--muted);font-size:14px;margin-top:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:13px;margin:10px 0;overflow:hidden}
.card-btn{width:100%;display:grid;grid-template-columns:42px 1fr 75px 22px;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:17px 18px;cursor:pointer}
.num{color:var(--muted);font-size:13px;font-weight:800}
.title{font-size:16px;font-weight:780;line-height:1.4}
.tags{font-size:11px;color:var(--muted);font-weight:800;text-align:right}
.chev{color:#aaa;transition:.15s transform}
.card.open .chev{transform:rotate(180deg)}
.body{display:none;border-top:1px solid var(--border);padding:23px 30px 26px 72px;font-size:16px;line-height:1.6}
.card.open .body{display:block}
.body p{margin:0 0 15px}
.body p:last-child{margin-bottom:0}
.body ol{margin:0;padding-left:22px}
mark{background:#fff0a6;border-radius:3px;padding:0 2px}
.empty{display:none;text-align:center;color:var(--muted);padding:30px}
@media(max-width:700px){
.wrapper{padding:18px 10px 50px}h1{font-size:25px}
.card-btn{grid-template-columns:26px 1fr 20px;gap:9px;padding:15px}
.tags{grid-column:2;text-align:left}
.body{padding:20px 16px;font-size:15px}
}
</style>
</head>
<body>
<div class="wrapper">
<h1>Digitas Interview Playbook</h1>
<div class="subtitle">Digital Designer · Dario Bazan</div>

<div class="controls">
<div class="panel">
<input id="search" placeholder="Search questions or answers..." />
<div class="filter-group" id="filters"></div>
<div class="counter">Showing <strong id="count">0</strong> questions</div>
</div>
</div>

<div id="content"></div>
<div id="empty" class="empty">No questions found.</div>
</div>

<script>
const questions = [{"id": 1, "title": "Tell me about your experience with motion graphics or animation.", "title_html": "Tell me about your <mark>experience with motion graphics</mark> or animation.", "body": "<p>I have some basic experience with motion graphics and animation. A long time ago I took an After Effects course and have also created simple animations in Figma and Framer. Motion hasn't been a major part of my previous roles, so it's not my strongest skill yet. However, I'm very interested in developing this skill and exploring how motion can improve digital experiences.</p>", "priority": false}, {"id": 2, "title": "How do you work with copywriters and content teams?", "title_html": "How do you work with <mark>copywriters and content teams</mark>?", "body": "<p>I have experience working closely with copywriters and content teams. At TW, I worked with a colleague who was responsible for campaign copy, blog content and other communications. We worked together to make sure the copy and design supported the same idea and worked well across the campaign.</p>\n<p>At BP, I also worked closely with the SEO team, who provided copy and content for digital projects.</p>\n<p>I believe working with content teams early helps align the message and the design, improve the overall customer experience, and create stronger digital work.</p>", "priority": true}, {"id": 3, "title": "Do you have experience using AI in your design process?/ How do you use AI in your creative workflow?", "title_html": "Do you have experience <mark>using AI in your design process</mark>?/ How do you use AI in your creative workflow?", "body": "<p>I use AI quite a lot as part of my design workflow. I use it to work faster, automate repetitive tasks, explore different ideas, and quickly create or test assets. For example, I use tools like Figma Make and Claude to explore design directions, generate assets, work with existing design systems, analyse briefs, and organise information.</p>\n<p>I see AI as a creative partner. It can help me explore more possibilities and move faster, but I need to guide it, ask the right questions, and use my design judgement to decide what works and what doesn't.</p>\n<p>I think AI is becoming an important part of the design process, and it's constantly evolving. So I believe designers need to keep experimenting, learning, and finding better ways to use it in their work.</p>", "priority": true}, {"id": 4, "title": "How do you approach your design process / workflow?", "title_html": "How do you approach your <mark>design process / workflow</mark>?", "body": "<p>My process changes depending on the project, but I follow a consistent structure. First, I make sure I understand the brief, the user needs, the business goals, the success criteria, and any technical constraints. If something isn't clear, I prefer to ask questions early.</p>\n<p>Then I review the current experience and any available insights, such as research, analytics, customer feedback, or stakeholder knowledge. I prioritise the highest-impact opportunities, explore solutions through wireframes, and move into high-fidelity UI and prototyping once the direction is clear.</p>\n<p>I collaborate with developers and stakeholders throughout the process, prepare a clean handoff, review the implementation, and use any available post-launch data to identify further improvements.</p>\n<p><strong>Foco:</strong> tu proceso completo de diseño, desde el brief hasta después del lanzamiento.</p>", "priority": true}, {"id": 5, "title": "How do you approach generating creative concepts for a campaign or project?", "title_html": "How do you approach <mark>generating creative concepts</mark> for a campaign or project?", "body": "<p>I start by understanding the brief, the audience, the business goal, and the key message. Then I explore different ideas and creative directions instead of jumping straight into one solution.</p>\n<p>I also look at the brand, existing campaigns, and how competitors are approaching similar campaigns. This helps me understand the visual landscape and find opportunities to create something relevant but still distinctive.</p>\n<p>I think it's always a good idea to brainstorm or review ideas with the team before moving into design. We can challenge the ideas, build on them, and choose the strongest direction together.</p>\n<p>From there, I usually sketch or create quick wireframes to explore the concept before developing the final design. For me, a strong concept needs to be creative, relevant to the audience, and connected to the business goal.</p>\n<p><strong>Foco:</strong> tu pensamiento creativo, cómo pasás de un brief a una conceptual direction.</p>", "priority": true}, {"id": 6, "title": "How do you communicate design decisions to stakeholders?", "title_html": "How do you communicate <mark>design decisions to stakeholders</mark>?", "body": "<p>I start by explaining the problem before presenting the solution. Then I explain how my design decisions support the user needs, the business goals, and any technical constraints or available insights.</p>\n<p>I like to use wireframes, prototypes, flows, or simple examples to make the reasoning easy to understand. I also like to share ideas early and create space for discussion, because stakeholders can bring useful context that I may not have.</p>\n<p>My goal is to make the reasoning clear, get everyone aligned, and find the best solution together.</p>", "priority": true}, {"id": 7, "title": "How do you handle feedback or criticism?", "title_html": "How do you handle <mark>feedback or criticism</mark>?", "body": "<p>I see feedback as an important part of the design process. First, I try to understand the reason behind the feedback and if there is something I didn't consider.</p>\n<p>I listen carefully, ask questions when needed, and if the feedback brings new information or improves the solution, I'm happy to adapt the design. If I have a different view, I explain my reasoning and discuss it with the team.</p>\n<p>I try to put my ego aside and focus on making the work better. At the end of the day, we all share the same goal: creating the best possible outcome for the user and the business.</p>", "priority": false}, {"id": 8, "title": "How do you handle it when a stakeholder or client pushes back on a creative decision you believe in?", "title_html": "How do you handle it when a <mark>stakeholder or client pushes back</mark> on a creative decision you believe in?", "body": "<p>First, I listen and try to understand why they have concerns. Then I explain the thinking behind the decision and connect it to the brief, the audience, the brand, or the business goal.</p>\n<p>If their feedback brings new information, I'm happy to adapt the idea. If I still believe the original direction is stronger, I'll explain why and use prototypes or examples to support my point.</p>\n<p>For me, it's not about being right. It's about finding the best solution for the user and the business.</p>", "priority": false}, {"id": 9, "title": "What is an area you want to develop?/ What would you like to develop or learn?", "title_html": "What is an <mark>area you want to develop</mark>?/ What would you like to develop or learn?", "body": "<p>I already use UX principles, heuristic evaluation, and available insights to support my design decisions. In my previous role, I also worked in a CRO-focused environment where analytics and customer insights were an important part of the process.</p>\n<p>One area I'd like to continue developing is experimentation and research, particularly A/B testing, user behaviour data, heatmaps, and user testing.</p>\n<p>I think gaining more practical experience in these areas will help me become a stronger Product Designer, especially in eCommerce and CRO.</p>", "priority": false}, {"id": 10, "title": "Tell me about a project you are particularly proud of.", "title_html": "Tell me about a <mark>project you are particularly proud of</mark>.", "body": "", "priority": false}, {"id": 11, "title": "Tell me about yourself and your experience", "title_html": "Tell me about <mark>yourself and your experience</mark>", "body": "<p>I'm Dario, originally from Argentina, with a degree in Graphic Design and a strong visual foundation. Over the years, I've worked across Product and Digital Design, with a strong focus on UI and creating clear, effective digital experiences.</p>\n<p>My first role in New Zealand was with Tourism Waitaki, where I worked for three and a half years as the sole designer, working across the organisation's brands and sub-brands on websites, landing pages, digital and print advertising, EDMs, and marketing campaigns.</p>\n<p>Then I moved to Auckland and joined Blackpepper, a specialist eCommerce agency, where I worked as a UI &amp; Digital Designer, designing eCommerce websites and apps for brands such as Starbucks, Glassons, Hallenstein, and Torpedo7, with a strong focus on CRO. I also worked closely with developers, project managers, marketing teams, and other designers to deliver high-quality digital experiences.</p>\n<p>Now I'm looking for my next challenge, where I can continue growing as a Product Designer while bringing my broader Digital Design experience across eCommerce, marketing, and visual design.</p>", "priority": true}, {"id": 12, "title": "Why are you looking for a new role?", "title_html": "Why are you <mark>looking for a new role</mark>?", "body": "<p>My previous company, Blackpepper, went through a restructure after losing some major clients, and my role was made redundant.</p>\n<p>It was a business decision and nothing related to my performance. I left on very good terms and have a good relationship with the team and the company. I'm also happy to provide references if needed.</p>\n<p>I really enjoyed my time there, and now I'm ready for my next step and looking for a new</p>\n<p>opportunity where I can continue growing as a designer.</p>", "priority": false}, {"id": 13, "title": "Why do you want to work here?", "title_html": "<mark>Why do you want to work here</mark>?", "body": "<p>I'm looking for a place where design, business, technology, and creativity work together, because that's where I feel I can add the most value.</p>\n<p>I'm particularly interested in <strong>Digitas</strong> because it's a global agency with a strong presence in New Zealand, and I like the opportunity to work with well-known brands such as Toyota, Z Energy, and Vero. I also like being part of a larger network like Publicis Groupe, with access to different people, projects, and opportunities to learn through Marcel.</p>\n<p>The role itself is also a great match for my experience because it combines digital experiences, CRM, websites, EDMs, and campaigns. I also like the focus on creative ideas and new technology, especially AI.</p>\n<p>I think I can bring my experience across UI, digital design, eCommerce, CRO, and digital campaigns, while continuing to grow as a designer.</p>", "priority": true}, {"id": 14, "title": "Why do you think you're a good fit for this role?", "title_html": "Why do you think you&#x27;re a <mark>good fit for this role</mark>?", "body": "<p>I think I'm a good fit because my experience aligns well with what you're looking for.</p>\n<p>I've worked across UI, digital design, eCommerce, CRO, EDMs, and digital campaigns, and I've worked closely with developers, marketing teams, project managers, and other designers.</p>\n<p>From the job description, it sounds like you're looking for someone who can take a brief, develop ideas, and turn them into strong digital work across different channels. That's very similar to how I've been working.</p>\n<p>I also think my experience with both design and marketing gives me a good understanding of how creative work needs to support the user and the business.</p>", "priority": true}, {"id": 15, "title": "How do you balance user needs, business goals, and technical constraints?", "title_html": "How do you balance <mark>user needs, business goals, and technical constraints</mark>?", "body": "<p>I believe the best solutions create value for everyone.</p>\n<p>Before making design decisions, I try to understand the user needs, the business goals, and any technical constraints.</p>\n<p>Sometimes there are trade-offs, so I work with the team to find the best balance.</p>\n<p>My goal is to create a solution that works well for the user, supports the business goals, and is realistic to build.</p>\n<p><strong>\"Trade-off\"</strong> significa una situación donde para ganar algo, tenés que ceder algo a cambio — no podés tener las dos cosas al 100%.</p>", "priority": false}, {"id": 16, "title": "Tell me about your digital marketing experience?", "title_html": "Tell me about your <mark>digital marketing experience</mark>?", "body": "<p>I've worked closely with marketing teams throughout my career. At Tourism Waitaki, I supported digital campaigns across the organisation's main brand and sub-brands, including Tourism Waitaki, Alps 2 Ocean, and the Oamaru Blue Penguin Colony.</p>\n<p>I worked across different channels, including social media, websites, landing pages, EDMs, digital assets, banners, and other campaign materials.</p>\n<p>At Blackpepper, I did similar work for the agency and its clients, adapting the design to different brands, audiences, and campaign goals.</p>\n<p>I usually worked from marketing briefs and translated the message and campaign goals into clear visual communication across different channels.</p>", "priority": true}, {"id": 17, "title": "Tell me about your EDM experience?", "title_html": "Tell me about your <mark>EDM experience</mark>?", "body": "<p>I've worked with EDMs throughout my career, both for the companies I worked for and for different clients.</p>\n<p>At Tourism Waitaki, I designed regular EDMs for Tourism Waitaki and its sub-brands, such as Alps 2 Ocean and the Oamaru Blue Penguin Colony.</p>\n<p>At Blackpepper, I also worked on EDMs for our own company and for CODY, our technology platform, including company and product updates. I also designed EDMs for clients such as Torpedo7 and King Plant Barn.</p>\n<p>For King Plant Barn, for example, I worked on different types of customer communications for members and non-members, including birthday emails, abandoned carts, back-in-stock emails, promotions, and other marketing campaigns.</p>\n<p>So I've worked with different audiences and different types of email communications, and I understand that the design needs to support both the message and the goal of each communication.</p>", "priority": true}, {"id": 18, "title": "Tell me about your Ecommerce experience?", "title_html": "Tell me about your <mark>Ecommerce experience</mark>?", "body": "<p>My strongest eCommerce experience comes from Blackpepper, a specialist eCommerce agency and partner of Google, Meta, and Shopify.</p>\n<p>I worked on eCommerce websites and apps for major brands such as Starbucks, Glassons, Hallenstein, and Torpedo7, with a strong focus on CRO and improving the customer experience and business outcomes.</p>\n<p>Working in an agency environment also gave me the opportunity to work across different brands, projects, and business needs, while collaborating closely with developers, project managers, and other designers.</p>", "priority": false}, {"id": 19, "title": "How do you collaborate with developers?", "title_html": "How do you <mark>collaborate with developers</mark>?", "body": "<p>I like to work closely with developers throughout the project, not just at the end.</p>\n<p>I like to involve them early to understand any technical constraints and discuss what is realistic to build.</p>\n<p>During the project, I prepare clean and organised Figma files with reusable components, different states, and clear documentation. I also add notes or examples when needed to make the design intent clear.</p>\n<p>I also have a basic understanding of HTML and CSS, which helps me communicate with developers and understand what is feasible to build.</p>\n<p>During implementation, I stay available to answer questions, review the work, and discuss any issues with the developers to find the best solution.</p>", "priority": false}, {"id": 20, "title": "What do you include in a design handoff?", "title_html": "What do you include in a <mark>design handoff</mark>?", "body": "<p>I make sure my Figma files are clean, organised, and ready for development.</p>\n<p>I include reusable components, layouts for different screen sizes, typography, spacing, colours, assets, and different states such as hover, loading, success, and error.</p>\n<p>When something isn't obvious, I add notes, examples, or documentation to make the design intent clear and reduce questions during development.</p>\n<p>I also stay available during implementation to answer questions, review the final build, and work with developers if any adjustments are needed.</p>", "priority": false}, {"id": 21, "title": "How do you manage/handle multiple projects, priorities and deadlines?", "title_html": "How do you manage/handle <mark>multiple projects, priorities and deadlines</mark>?", "body": "<p>I handle multiple projects by staying organised and communicating clearly.</p>\n<p>Before starting any project, I make sure I understand the brief, the priorities, the deadlines, and the business goals.</p>\n<p>I prioritise my work based on discussions with the Project Manager, business impact, and deadlines.</p>\n<p>At Blackpepper and Tourism Waitaki, I regularly managed multiple projects at the same time, working across different brands and teams, so I'm comfortable managing different priorities.</p>\n<p>If priorities change, I communicate early and work with the team to find the best solution.</p>", "priority": false}, {"id": 22, "title": "Do you have experience with UX research, A/B testing, heatmaps, or journey maps?", "title_html": "Do you have experience with <mark>UX research, A/B testing, heatmaps, or journey maps</mark>?", "body": "<p>I studied UX/UI formally, so I understand methods such as A/B testing, heatmaps, and journey mapping. In my roles so far, that side was usually handled by someone else on the team, such as a Design Lead or research specialist.</p>\n<p>My role was to take the available data and insights and turn them into design decisions. I also use UX principles and heuristic evaluation to assess and improve digital experiences.</p>\n<p>At Blackpepper, working in a CRO-focused eCommerce agency reinforced this approach. Metrics such as conversion rate, cart abandonment, and average order value were part of how I thought about design.</p>\n<p>I'd like to continue developing my practical experience with experimentation, user behaviour data, heatmaps, and user testing as I grow further as a Product Designer, particularly in eCommerce and CRO.</p>", "priority": false}, {"id": 23, "title": "Tell me about your Shopify experience?", "title_html": "Tell me about your <mark>Shopify experience</mark>?", "body": "<p>I have limited direct experience with Shopify. Blackpepper became a certified Shopify partner relatively recently, close to when my role ended, so I didn't have much opportunity to work directly with the platform.</p>\n<p>However, I have strong eCommerce experience from working at Blackpepper, a specialist eCommerce agency and partner of Google, Meta, and Shopify. I worked on eCommerce websites and apps for brands such as Starbucks, Glassons, Hallenstein, and Torpedo7, with a strong focus on CRO and the customer experience.</p>\n<p>So while my direct Shopify experience is limited, I have a strong understanding of eCommerce design and I'm confident I could get up to speed with the platform quickly.</p>", "priority": false}, {"id": 24, "title": "Do you have questions for us?", "title_html": "Do you have <mark>questions for us</mark>?", "body": "<ol><li>1. <strong>What are the next steps in the process?</strong></li><li>2. Could you tell me a little more about the team I'd be working with?</li><li>3. What are the main challenges for this position?</li><li>4. What kind of work would I be doing most of the time? Would it be more focused on marketing and campaigns, or would I also work on websites, apps, and UX/UI projects?</li><li>5. Would there be opportunities to work on CRO, A/B testing, or user research? These are areas I'd like to develop further.</li><li>6. What would you expect from the person in this role in the first few months?</li><li>7. How important is CRO for the business, and which metrics matter most?</li></ol>", "priority": false}];
const filtersEl=document.getElementById("filters");
const contentEl=document.getElementById("content");
const countEl=document.getElementById("count");
const searchEl=document.getElementById("search");
const emptyEl=document.getElementById("empty");
let activeFilter="ALL";

function renderFilters(){
  const fs=[["ALL","ALL"],["PRIORITY","PRIORITY"],["REST","REST"]];
  filtersEl.innerHTML=fs.map(([k,v])=>`<button class="filter ${k===activeFilter?"active":""}" data-filter="${k}">${v}</button>`).join("");
  filtersEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;renderFilters();render();});
}

function render(){
  const term=searchEl.value.trim().toLowerCase();
  const list=questions.filter(q=>{
    const filterOk=activeFilter==="ALL"||(activeFilter==="PRIORITY"&&q.priority)||(activeFilter==="REST"&&!q.priority);
    const hay=(q.title+" "+q.body).toLowerCase();
    return filterOk && (!term || hay.includes(term));
  });
  contentEl.innerHTML=list.map(q=>`
    <article class="card">
      <button class="card-btn" type="button">
        <div class="num">${q.id}</div>
        <div class="title">${q.title_html}</div>
        <div class="tags">${q.priority?"PRIORITY":"REST"}</div>
        <span class="chev">⌄</span>
      </button>
      <div class="body">${q.body}</div>
    </article>`).join("");
  countEl.textContent=list.length;
  emptyEl.style.display=list.length?"none":"block";
  contentEl.querySelectorAll(".card-btn").forEach(b=>b.onclick=()=>b.closest(".card").classList.toggle("open"));
}

searchEl.addEventListener("input",render);
renderFilters();
render();
</script>
</body>
</html>
