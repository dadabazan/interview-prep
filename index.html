<script>
const questions = [{"id": 1, "title": "Tell me about yourself and your experience", "title_html": "Tell me about <mark>yourself and your experience</mark>", "body": "<p>I'm Dario, originally from Argentina. I have a degree in Graphic Design, which gave me a strong visual foundation. I've worked as a designer for many years across different environments, including startups, digital agencies, and public organisations.</p>\n<p>In New Zealand, my first role was with <strong>Tourism Waitaki,</strong> where I worked for three and a half years as the sole designer. There I was responsible for the visual communication across its brands and sub-brands, designing websites, landing pages, digital and print advertising, EDMs, and marketing campaigns.</p>\n<p>When I obtained my PR, I moved to Auckland and joined <strong>Blackpepper,</strong> a specialist eCommerce agency and partner of Google, Meta, and Shopify, where I worked as a UI &amp; Digital Designer, designing eCommerce websites and apps for brands such as Starbucks, Glassons, Hallenstein, and Torpedo7, with a strong focus on CRO.</p>\n<p>I was part of a multidisciplinary team, collaborating closely with developers, project managers, marketing teams, and other designers.</p>\n<p>Now I'm looking for my next challenge, where I can continue growing as a designer while bringing my experience in Product and Digital Design, eCommerce, and visual design.</p>", "priority": true}, {"id": 2, "title": "Why are you looking for a new role?", "title_html": "Why are you <mark>looking for a new role</mark>?", "body": "<p>My previous company, Blackpepper, <strong>went through a restructure</strong> after losing some major clients, and my role was made redundant.</p>\n<p>It was a business decision. I left on very good terms and have a good relationship with the team and the company. I'm also happy to provide references if needed.</p>\n<p>I really enjoyed my time there, and now I'm ready for my next step and looking for an opportunity where I can continue growing as a designer.</p>", "priority": false}, {"id": 3, "title": "Why do you want to work here?", "title_html": "Why do you <mark>want to work here</mark>?", "body": "<p>I'm looking for a place where design, business, and technology work together.</p>\n<p><strong>Digitas: This role interests me because it combines</strong> digital experiences, CRM “see ar em”, websites, EDMs, and campaigns, which is a perfect match for my experience in digital design, eCommerce, and CRO.</p>\n<p><strong>I have a particular interest in Digitas because</strong> it's a global agency where I can work with talented people across different teams and well-known brands such as Toyota, Z Energy, Aldi, McDonald's, and Vero. I also like being part of a global group like Publicis Groupe, with great benefits and opportunities to learn. <strong>I'm also very interested in AI,</strong> and I really like that it's a very important part of Digitas. I recently read your article in “LBB Online” about AI and content, and I found your perspective really interesting. I share that view, and I'd love to work in an environment where AI is a big part of the work.</p>\n<p>Overall, I think it's a great opportunity for me to bring my experience and continue growing as a designer.</p>", "priority": true}, {"id": 4, "title": "How do you use AI in your design process?", "title_html": "How do you use <mark>AI in your design process</mark>?", "body": "<p>I use AI as a tool to work faster and explore more ideas, but I always <strong>use my own design judgment</strong> to understand the context and balance user needs with business goals.</p>\n<p><strong>I use tools like Claude and Figma Make to</strong> analyse briefs, organise information, and explore different design directions. For example, I can use AI to explore different UI ideas or work with an existing design system.</p>\n<p><strong>AI is something I'm very interested in, and I'm always looking for new ways to use it in my work.</strong> I also want to keep learning and developing this skill, especially in an environment where AI is an important part of the design process.</p>", "priority": true}, {"id": 5, "title": "How do you think AI will change the role of designers?", "title_html": "How do you think <mark>AI will change the role of designers</mark>?", "body": "<p>I think AI will change the way designers work, but I don't think it will replace the need for design thinking.</p>\n<p>AI can help designers work faster, explore more ideas, and automate some repetitive tasks. But designers still need to understand the context, the users, the business goals, and make the right design decisions. For me, AI is a tool that can support the creative process, not replace design judgment. I'm interested in continuing to learn how to use it effectively.</p>", "priority": false}, {"id": 6, "title": "Why do you think you're a good fit for this role? Why should we hire you?", "title_html": "Why do you think you're a <mark>good fit</mark> for this role? Why should we hire you?", "body": "<p>I think I'm a good fit because my experience aligns well with what you're looking for.</p>\n<p>I've worked across UI, digital and product design, eCommerce, CRO, and digital experiences, and I've worked closely with developers, project managers, marketing teams, and other designers.</p>\n<p>I'm comfortable taking a brief or a problem, exploring different directions, and creating a clear and effective digital solution.</p>\n<p>I also bring a strong visual foundation, but I care about understanding the problem, the user needs, the business goals, and what is technically possible, and then using design to create the right solution.</p>", "priority": true}, {"id": 7, "title": "What are your strengths?", "title_html": "What are your <mark>strengths</mark>?", "body": "<p>My main strengths are my strong visual design skills, my ability to solve problems through design, and my focus on results.</p>\n<p>I care about understanding the problem, the user needs, and the business goals, not just the visual outcome.</p>\n<p>I'm also curious by nature, and I'm always looking for new ways to learn and improve my work.</p>", "priority": false}, {"id": 8, "title": "What is a weakness or area you'd like to improve?", "title_html": "What is a <mark>weakness</mark> or area you'd like to improve?", "body": "<p>One area I'm working on is becoming more confident when presenting and explaining <strong>my design work in English</strong>. I can communicate my ideas clearly, but I want to become more confident and natural when presenting to clients and stakeholders.</p>\n<p>I'm actively working on improving my English and becoming more confident in these situations.</p>", "priority": false}, {"id": 9, "title": "What would you like to develop or learn?", "title_html": "What would you like to develop or learn?", "body": "<p>I already use UX principles, heuristic evaluation, and available insights to support my design decisions, but <strong>one area I'd like to develop is</strong> research, particularly A/B testing, heatmaps, user behaviour data, and user testing.</p>\n<p>I think this will <strong>help me make better design decisions based on data.</strong></p>", "priority": false}, {"id": 10, "title": "How do you approach your brief / design process / workflow / customer journey?", "title_html": "How do you approach your brief / <mark>design process / workflow / customer journey</mark>?", "body": "<p>My process changes depending on the project, but I follow a consistent structure.</p>\n<p><strong>First, I make sure I understand the</strong> brief, the user needs, the business goals, the success criteria, and any technical constraints. If something isn't clear, I prefer to ask questions early.</p>\n<p><strong>Then I review the current experience and any available evidence,</strong> such as research, analytics, customer feedback, or stakeholder knowledge.</p>\n<p><strong>I prioritise the highest-impact opportunities</strong>, explore solutions through wireframes, and move into high-fidelity UI and prototyping once the direction is clear. <strong>I collaborate with developers and stakeholders</strong> throughout the process, prepare a clean handoff, review the implementation, and use any available post-launch data to identify further improvements.</p>", "priority": true}, {"id": 11, "title": "How do you approach generating creative concepts for a project?", "title_html": "How do you approach <mark>generating creative concepts</mark> for a project?", "body": "<p><strong>I start by understanding the</strong> brief, the audience, the business goal, and the key message or problem we need to solve.</p>\n<p><strong>Then I like to explore different ideas</strong> and directions before choosing a solution.</p>\n<p><strong>I also look at the brand, existing work</strong>, and the context to find opportunities to create something relevant but distinctive.</p>\n<p><strong>I like to review ideas with the team</strong>, get feedback, and choose the strongest direction together.</p>\n<p>For me, a strong concept needs to be relevant to the user, connected to the business goal, and have a clear idea behind it.</p>\n<p><strong>Tell me about a project where you took a brief and developed a creative concept.</strong></p>\n<p><strong>Travel through time:</strong></p>\n<p>In that project at Tourism Waitaki, I was the sole designer and received a brief to create a campaign to attract tourists to Oamaru. My first step was to understand what made Oamaru unique, and the Victorian architecture and heritage were a big part of that.</p>\n<p>From there, I explored how to turn that cultural identity into an idea that would connect with visitors.</p>\n<p>I explored different visual directions and developed <strong>“Travel Through Time”</strong> as the central concept.</p>\n<p>Finally, I developed the visual direction across different formats and touchpoints, making sure the experience stayed consistent and connected to the audience and the campaign goal.</p>", "priority": true}, {"id": 12, "title": "Tell me about a project you are particularly proud of. / Tell me about a time you improved conversion.", "title_html": "Tell me about a <mark>project you are particularly proud of</mark>. / Tell me about a time you improved conversion.", "body": "<p><strong>⭐ Huntech – Short Version</strong> (60–90 sec) Huntech is a New Zealand outdoor retailer specialising in technical hunting gear and equipment. However, its eCommerce experience was no longer keeping up with the needs of the business, and there were several opportunities to improve the shopping experience and conversion.</p>\n<p>My role was to lead the UI redesign, working within a multidisciplinary team under our Design Lead. Before designing, I conducted a heuristic analysis to understand where we could create the biggest impact. We focused on the Product Listing Page and Product Detail Page, where customers compare products and make purchase decisions.</p>\n<p>I grouped the findings into three areas: Usability, Comprehension, and Merchandising, and translated them into five key design improvements, including stock and size visibility, product discovery, mobile filtering, product information, and shopping efficiency. I also contributed to the Design System and prepared the designs for developer handoff. After launch, Blackpepper reported a 125% increase in revenue and a 41% increase in Average Order Value. While many factors can influence these results, the project showed me how thoughtful UI design can reduce uncertainty, improve the customer experience, and support business goals.</p>\n<p><strong>⭐ Huntech - Long Version</strong> (3–5 min)</p>\n<p><strong>Para presentar el case study completo, mientras compartís pantalla y recorres el portfolio con el entrevistador.</strong></p>\n<p>Huntech is a New Zealand outdoor retailer specialising in technical hunting gear and equipment.</p>\n<p>However, its eCommerce experience was no longer keeping up with the needs of the business. The platform had several limitations that affected the shopping experience and created opportunities to improve conversion.</p>\n<p><strong>My Role</strong></p>\n<p>My role was to lead the UI redesign, working within a multidisciplinary team under our Design Lead.</p>\n<p>I was responsible for identifying key usability issues, translating findings into practical UI solutions, contributing to the Design System, and preparing the designs for developer handoff.</p>\n<p>Audit &amp; Diagnosis</p>\n<p>Before designing, I wanted to understand where we could create the biggest impact. I conducted a heuristic analysis across the purchase journey to identify friction points affecting both the user experience and business goals. The review uncovered opportunities around Usability, Comprehension, and Merchandising.</p>\n<p>Rather than redesigning the entire website, we focused on the Product Listing Page and Product Detail Page because that's where customers compare products and make purchase decisions.</p>\n<p>The goal was to reduce purchase uncertainty and help users make decisions with greater confidence.</p>\n<p><strong>Design Decisions</strong></p>\n<p>From the findings, I prioritised the highest-impact opportunities and translated them into <strong>five key design decisions.</strong></p>\n<p><strong>1. The first was Product Confidence.</strong></p>\n<p>Users couldn't always see stock availability, sizing was inconsistent, and the Size Guide wasn't very visible.</p>\n<p>I introduced real-time stock visibility, standardised sizing patterns, and a more visible Size Guide to reduce uncertainty around size and stock.</p>\n<p><strong>2. The second was Product Discovery.</strong></p>\n<p>The mobile navigation was unclear, search had no guidance, and the category structure was too text-heavy.</p>\n<p>I introduced a clearer navigation structure, guided search, and visual category tiles to help users find products faster and reduce uncertainty. <strong>3. The third was Mobile Filtering.</strong></p>\n<p>The filtering experience required multiple steps, there was no sorting option, and some touch targets were too small on mobile.</p>\n<p>I combined filtering and sorting into one flow and introduced larger, touch-safe controls to make the experience easier to use on mobile.</p>\n<p><strong>4. The fourth was Product Communication.</strong></p>\n<p>Important product benefits were mainly explained through text, and the Add to Cart button wasn't always visible.</p>\n<p>I introduced visual icons for key product benefits and a sticky Add to Cart button to make product information clearer and keep the purchase action visible.</p>\n<p><strong>5. The last was Shopping Efficiency.</strong></p>\n<p>Users had to open the product page before adding an item to the cart, and product cards were inconsistent.</p>\n<p>I introduced Quick Add directly from the Product Listing Page and made the product cards more consistent, helping users shop more efficiently.</p>\n<p>Design System &amp; Delivery</p>\n<p>Alongside the redesign, I also worked within the existing Design System, adapting and expanding components to support Huntech's specific needs and create a more consistent purchase experience.</p>\n<p>I documented the final designs in Figma and prepared them for developer handoff. <strong>Impact</strong></p>\n<p>After launch, Blackpepper reported a 125% increase in revenue and a 41% increase in Average Order Value.</p>\n<p>While many factors can influence business performance, these results suggest that reducing uncertainty and improving the purchase experience can contribute to stronger commercial outcomes.</p>\n<p><strong>Reflection</strong></p>\n<p>The biggest lesson for me from this project was that reducing uncertainty doesn't always mean simplifying the interface.</p>\n<p>Users needed confidence that the size was available, the product was right for them, and it was worth the price.</p>\n<p>For me, this project showed how thoughtful UI design can support purchase decisions while balancing user needs and business goals.</p>", "priority": true}, {"id": 13, "title": "How do you balance user needs, business goals, and technical constraints?", "title_html": "How do you balance <mark>user needs, business goals, and technical constraints</mark>?", "body": "<p>I believe the best solutions create value for everyone.</p>\n<p>Before making design decisions, I try to understand the user needs, the business goals, and any technical constraints.</p>\n<p>Sometimes there are <strong>trade-offs</strong>, so I work with the team to find the best balance. In Huntech, for example, we focused on reducing purchase uncertainty while also improving the shopping experience and supporting conversion.</p>\n<p>My goal is to create a solution that works well for the user, supports the business goals, and is realistic to build. <strong>\"Trade-off\"</strong> significa una situación donde para ganar algo, tenés que ceder algo a cambio — no podés tener las dos cosas al 100%.</p>", "priority": true}, {"id": 14, "title": "How do you communicate design decisions to stakeholders?", "title_html": "How do you communicate <mark>design decisions to stakeholders</mark>?", "body": "<p>I start by explaining the problem before presenting the solution. Then I explain how my design decisions support the user needs, the business goals, and any technical constraints or available insights.</p>\n<p>I like to use wireframes, prototypes, flows, or simple examples to make the reasoning easy to understand. I also like to share ideas early and create space for discussion, because stakeholders can bring useful context that I may not have.</p>\n<p>My goal is to make the reasoning clear, get everyone aligned, and find the best solution together.</p>", "priority": true}, {"id": 15, "title": "How do you handle feedback or criticism?", "title_html": "How do you handle <mark>feedback or criticism</mark>?", "body": "<p>I see feedback as an important part of the design process. First, I try to understand the reason behind the feedback and if there is something I didn't consider.</p>\n<p>I listen carefully, ask questions when needed, and if the feedback brings new information or improves the solution, I'm happy to adapt the design. If I have a different view, I explain my reasoning and discuss it with the team.</p>\n<p>I try to put my ego aside and focus on making the work better. At the end of the day, we all share the same goal: creating the best possible outcome for the user and the business.</p>", "priority": true}, {"id": 16, "title": "How do you handle it when a stakeholder or client pushes back on a creative decision you believe in?", "title_html": "How do you handle it when a stakeholder or client pushes back on a creative decision you believe in?", "body": "<p>First, I listen and try to understand why they have concerns.</p>\n<p>Then I explain the thinking behind the decision and connect it to the brief, the users, the brand, or the business goal.</p>\n<p>If I learn something new from their feedback, I'm happy to change the idea. If I still believe my solution is stronger, I'll explain why and use prototypes or examples to show my thinking.</p>\n<p>For me, it's about working together to find the best solution for the users and the business.</p>", "priority": false}, {"id": 17, "title": "How do you work with copywriters and content teams?", "title_html": "How do you work with copywriters and content teams?", "body": "<p>I have experience working closely with copywriters and content teams across both Tourism Waitaki and Blackpepper.</p>\n<p><strong>At Tourism Waitaki</strong>, I worked with a colleague responsible for campaign copy, blog content, and other communications.</p>\n<p><strong>At Blackpepper,</strong> I worked closely with the SEO team, who provided copy for websites, blog content, EDMs, and other digital projects.</p>\n<p>I worked with them to make sure the content and design worked well together. I think involving content teams early creates a stronger overall experience.</p>", "priority": false}, {"id": 18, "title": "How do you collaborate with developers?", "title_html": "How do you <mark>collaborate with developers</mark>?", "body": "<p>I like to work closely with developers throughout the project, not just at the end. I involve them early to understand any technical constraints and discuss what is realistic to build.</p>\n<p>During the project, I prepare clean and organised Figma files with reusable components, different states, and clear documentation. I also add notes or examples when needed to make the design intent clear.</p>\n<p>I also have a basic understanding of HTML and CSS, which helps me communicate with developers and understand what is feasible to build.</p>\n<p>During implementation, I stay available to answer questions, review the work, and discuss any issues with developers to find the best solution.</p>", "priority": true}, {"id": 19, "title": "What do you include in a design handoff?", "title_html": "What do you include in a <mark>design handoff</mark>?", "body": "<p>I make sure my Figma files are clean, organised, and ready for development.</p>\n<p>I include reusable components, layouts for different screen sizes, typography, spacing, colours, assets, and different states such as hover, loading, success, and error.</p>\n<p>When something isn't obvious, I add notes, examples, or documentation to make the design intent clear and reduce questions during development.</p>\n<p>I also stay available during implementation to answer questions, review the final build, and work with developers if any adjustments are needed.</p>", "priority": false}, {"id": 20, "title": "How do you use Design Systems or Libraries and component libraries?", "title_html": "How do you use Design Systems or Libraries and component libraries?", "body": "<p>At Blackpepper, I helped maintain design systems for multiple eCommerce clients — adding new components, improving existing ones, and making sure everything stayed consistent and scalable. I worked in Figma using shared libraries, variants, auto layout, and design tokens for things like colour, typography, and spacing.</p>\n<p>I believe a good design system is valuable because it helps teams work faster, maintain consistency, and reduce mistakes, especially when working across multiple brands.</p>", "priority": false}, {"id": 21, "title": "How do you manage/handle multiple projects, priorities and deadlines?", "title_html": "How do you manage/handle <mark>multiple projects, priorities and deadlines</mark>?", "body": "<p>I handle multiple projects by staying organised and communicating clearly.</p>\n<p>Before starting any project, I make sure I understand the brief, the priorities, the deadlines, and the business goals.</p>\n<p>I prioritise my work based on discussions with the Project Manager, business impact, and deadlines.</p>\n<p>At Blackpepper and Tourism Waitaki, I regularly managed multiple projects at the same time, working across different brands and teams, so I'm comfortable managing different priorities.</p>\n<p>If priorities change, I communicate early and work with the team to find the best solution.</p>", "priority": true}, {"id": 22, "title": "How do you measure if a design is successful?", "title_html": "How do you <mark>measure if a design is successful</mark>?", "body": "<p>For me, success means improving both UX and business outcomes.</p>\n<p>I look at how the design reduces friction, brings clarity, and helps users complete their tasks.</p>\n<p><strong>In eCommerce</strong>, relevant metrics include Conversion Rate, Cart Abandonment, and Average Order Value. <strong>In marketing and digital projects</strong>, I look at engagement, how clearly the message is communicated, and brand consistency across channels.</p>\n<p><strong>In UX/UI,</strong> I also pay attention to qualitative feedback — if the experience feels clear and easy to use, even when there isn't hard data available.</p>\n<p>I haven't always tracked the metrics myself, but I design with those goals in mind and use available team data to inform and improve my work.</p>", "priority": false}, {"id": 23, "title": "Do you have experience with UX research, A/B testing, heatmaps, or journey maps?", "title_html": "Do you have experience with <mark>UX research, A/B testing, heatmaps, or journey maps</mark>?", "body": "<p>I studied UX/UI formally, so I understand methods such as A/B testing, heatmaps, and journey mapping. In my previous roles, that side was usually handled by someone else on the team, such as a Design Lead or research specialist.</p>\n<p><strong>My role was to take the available data and insights and turn them into design decisions</strong>. I also use UX principles and heuristic evaluation to review and improve digital experiences.</p>\n<p>At Blackpepper, working in a CRO-focused eCommerce agency helped me develop this approach. Metrics such as conversion rate, cart abandonment, and Average Order Value were part of how I thought about design.</p>\n<p>I haven't had many opportunities to apply these methods in my professional work, so I'd like to get more practical experience and continue developing these skills.</p>\n<p>Tell me about your digital marketing experience?</p>\n<p>I've worked closely with marketing teams throughout my career. At Tourism Waitaki, I supported digital campaigns for our main brand and sub-brands, such as Tourism Waitaki, Alps 2 Ocean, and the Oamaru Blue Penguin Colony.</p>\n<p>I worked across different channels, including social media, websites, landing pages, EDMs, digital assets, banners, and other campaign materials.</p>\n<p>At Blackpepper, I did similar work for our own brands and also for different clients, adapting the design to their brand, audience, and campaign goals.</p>\n<p>I usually worked from marketing briefs and helped translate the message and campaign goals into clear visual communication across different channels.</p>\n<p>Tell me about your EDM experience?</p>\n<p>I've worked with EDMs throughout my career.</p>\n<p>At Tourism Waitaki, I designed regular EDMs for Tourism Waitaki and its sub-brands, such as Alps 2 Ocean and the Oamaru Blue Penguin Colony.</p>\n<p>At Blackpepper, I also worked on EDMs for our own company and for CODY, our technology platform, including company and product updates. I also designed EDMs for clients such as Torpedo7 and King Plant Barn.</p>\n<p>For King Plant Barn, for example, I worked on different types of customer communications for members and non-members, including birthday emails, abandoned carts, back-in-stock emails, promotions, and other marketing campaigns.</p>\n<p>So I've worked with different audiences and types of email communications, and I understand that the design needs to support both the message and the goal of each communication. Do you have experience with Lifecycle Marketing?</p>\n<p>Yes, I have experience with Lifecycle Marketing through my work with EDMs and customer communications.</p>\n<p>At Blackpepper, I designed different types of EDMs for clients such as King Plant Barn, including birthday emails, abandoned carts, back-in-stock emails, promotions, and member communications.</p>\n<p>I worked with different audiences and types of customer communications, making sure the design supported the message and the goal of each communication.</p>", "priority": true}, {"id": 24, "title": "Tell me about your digital marketing, EDM and Lifecycle Marketing experience.", "title_html": "Tell me about your <mark>digital marketing, EDM and Lifecycle Marketing</mark> experience.", "body": "<p>I've worked closely with marketing teams throughout my career. <strong>At Tourism Waitaki</strong>, I supported digital campaigns for our main brand and sub-brands, such as Tourism Waitaki, Alps 2 Ocean, and the Oamaru Blue Penguin Colony. I worked across different channels, including social media, websites, landing pages, EDMs, digital assets, banners, and other campaign materials. <strong>At Blackpepper</strong>, I did similar work for our own brands and also for different clients, adapting the design to their brand, audience, and campaign goals. I usually worked from marketing briefs and helped translate the message and campaign goals into clear visual communication across different channels.</p>\n<p>I've worked with EDMs throughout my career. <strong>At Tourism Waitaki</strong>, I designed regular EDMs for Tourism Waitaki and its sub-brands, such as Alps 2 Ocean and the Oamaru Blue Penguin Colony. <strong>At Blackpepper,</strong> I also worked on EDMs for our own company and for CODY, our technology platform, including company and product updates. I also designed EDMs for clients such as Torpedo7 and King Plant Barn. For <strong>King Plant Barn</strong>, for example, I worked on different types of customer communications for members and non-members, including birthday emails, abandoned carts, back-in-stock emails, promotions, and other marketing campaigns. So I've worked with different audiences and types of email communications, and I understand that the design needs to support both the message and the goal of each communication.</p>\n<p>Yes, I have experience with Lifecycle Marketing <strong>through my work with EDMs and customer communications.</strong> At Blackpepper, I designed different types of EDMs for clients such as King Plant Barn, including birthday emails, abandoned carts, back-in-stock emails, promotions, and member communications. I worked with different audiences and types of customer communications, making sure the design supported the message and the goal of each communication.</p>", "priority": true}, {"id": 25, "title": "Tell me about your eCommerce experience.", "title_html": "Tell me about your eCommerce experience.", "body": "<p>My strongest eCommerce experience comes from Blackpepper, a specialist eCommerce agency and partner of Google, Meta, and Shopify.</p>\n<p><strong>I worked on eCommerce websites and apps for major brands</strong> such as Starbucks, Glassons, Hallenstein, and Torpedo7, with a strong focus on CRO and improving the customer experience and business outcomes.</p>\n<p>Working in an agency environment also gave me the opportunity to work across different brands, projects, and business needs, while collaborating closely with developers, project managers, and other designers.</p>", "priority": false}, {"id": 26, "title": "Tell me about your Shopify experience?", "title_html": "Tell me about your <mark>Shopify experience</mark>?", "body": "<p>I have limited direct experience with Shopify.</p>\n<p>Blackpepper became a certified Shopify partner relatively recently, close to when my role ended, so I didn't have much opportunity to work directly with the platform. However, I have strong eCommerce experience from working at Blackpepper, a specialist eCommerce agency and partner of Google, Meta, and Shopify.</p>\n<p>I worked on eCommerce websites and apps for brands such as Starbucks, Glassons, Hallenstein, and Torpedo7, with a strong focus on CRO and the customer experience.</p>\n<p>So while my direct Shopify experience is limited, I have a strong understanding of eCommerce design and I'm confident I can learn the platform quickly.</p>", "priority": false}, {"id": 27, "title": "Tell me about your experience with motion graphics or animation.", "title_html": "Tell me about your experience with <mark>motion graphics or animation</mark>.", "body": "<p>I have some experience with motion graphics and animation.</p>\n<p>A while ago, I took an After Effects course and have also created simple animations in Figma and Framer.</p>\n<p><strong>Motion hasn't been a major part of my previous roles, so it's not my strongest skill yet.</strong> However, I'd like to develop this skill and explore how motion can improve digital experiences.</p>", "priority": false}, {"id": 28, "title": "How do you work autonomously or as a sole designer?", "title_html": "How do you <mark>work autonomously or as a sole designer</mark>?", "body": "<p>I feel completely comfortable working autonomously because I've done it before.</p>\n<p>At <strong>Tourism Waitaki</strong>, I was the <strong>sole designer for the region</strong>, managing projects from start to finish.</p>\n<p>I really enjoy the autonomy and responsibility that comes with the role, but I also know when to ask questions, share ideas, or involve the team when needed.</p>", "priority": true}, {"id": 29, "title": "Do you have questions for us?", "title_html": "Do you have <mark>questions for us</mark>?", "body": "<p>1. What kind of work would I be doing most of the time? How would you describe the balance between campaigns and CRM, and websites, apps, and digital experiences? 2. What are you looking for this person to bring to the team? 3. How do you see this role developing over time, in terms of responsibilities and the type of work I could take on? 4. How is the design team structured, and who would I work with most closely? 5. What are the next steps in the process?</p>", "priority": false}];
const filtersEl=document.getElementById("filters");
const contentEl=document.getElementById("content");
const countEl=document.getElementById("count");
const searchEl=document.getElementById("search");
const clearSearchEl=document.getElementById("search-clear");
const emptyEl=document.getElementById("empty");
let activeFilter="ALL";

function renderFilters(){
  const fs=[["ALL","ALL"],["PRIORITY","PRIORITY"],["REST","REST"]];
  filtersEl.innerHTML=fs.map(([k,v])=>`<button class="filter ${k===activeFilter?"active":""}" data-filter="${k}">${v}</button>`).join("");
  filtersEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;renderFilters();render();});
}

function render(){
  const term=searchEl.value.trim().toLowerCase();
  clearSearchEl.style.display=term?"block":"none";
  const list=questions.filter(q=>{
    const filterOk=activeFilter==="ALL"||(activeFilter==="PRIORITY"&&q.priority)||(activeFilter==="REST"&&!q.priority);
    const hay=(q.title+" "+q.body).toLowerCase();
    return filterOk && (!term || hay.includes(term));
  });
  contentEl.innerHTML=list.map(q=>`
    <article class="card">
      <button class="card-btn" type="button">
        <div class="num">${q.id}</div>
        <div class="title">${q.title_html}</div>
        <div class="tags">${q.priority?"PRIORITY":"REST"}</div>
        <span class="chev">⌄</span>
      </button>
      <div class="body">${q.body}</div>
    </article>`).join("");
  countEl.textContent=list.length;
  emptyEl.style.display=list.length?"none":"block";
  contentEl.querySelectorAll(".card-btn").forEach(b=>b.onclick=()=>b.closest(".card").classList.toggle("open"));
}

searchEl.addEventListener("input",render);
clearSearchEl.addEventListener("click",()=>{searchEl.value="";searchEl.focus();render();});
renderFilters();
render();
</script>
</body>
</html>
