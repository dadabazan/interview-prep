<script>
const questions = [{"id": 1, "title": "Tell me about yourself", "title_html": "Tell me about <mark>yourself and your experience</mark>", "body": "<p>I'm Dario, originally from Argentina. I have a degree in Graphic Design, which gave me a strong visual foundation. I've worked as a designer for many years across different environments, including startups, digital agencies, and public organisations.</p><p>In New Zealand, my first role was with <strong>Tourism Waitaki,</strong> where I worked for three and a half years as the sole designer. There I was responsible for the visual communication across its brands and sub-brands, designing websites, landing pages, digital and print advertising, EDMs, and marketing campaigns.</p><p>When I obtained my PR, I moved to Auckland and joined <strong>Blackpepper,</strong> a specialist eCommerce agency and partner of Google, Meta, and Shopify, where I worked as a UI &amp; Digital Designer, designing eCommerce websites and apps for brands such as Starbucks, Glassons, Hallenstein, and Torpedo7, with a strong focus on CRO.</p><p>I was part of a multidisciplinary team, collaborating closely with developers, project managers, marketing teams, and other designers.</p><p>Now I'm looking for my next challenge, where I can continue growing as a designer while bringing my experience in Product and Digital Design, eCommerce, and visual design.</p>", "priority": true, "digitas_rank": 1, "needs_review": false}, {"id": 2, "title": "Do you have the right to work in NZ?", "title_html": "Do you have the <mark>right to work in NZ?</mark>", "body": "<p>Yes. I'm a Permanent Resident, so I have full work rights. No restrictions.</p>", "priority": true, "digitas_rank": null, "needs_review": false}, {"id": 3, "title": "Why are you looking for a new role?", "title_html": "Why are you <mark>looking for a new role?</mark>", "body": "<p>My previous company, Blackpepper, <strong>went through a restructure</strong> after losing some major clients, and my role was made redundant.</p><p>It was a business decision. I left on very good terms and have a good relationship with the team and the company.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 4, "title": "What type of role are you looking for?", "title_html": "What <mark>type of role</mark> are you looking for?", "body": "<p>I'm looking for a role where I can combine UI design with business thinking to create good digital experiences.</p><p>My experience includes product design, digital and graphic design, eCommerce, and marketing — so I'm open to different opportunities, depending on the team and the product.</p><p>I'd especially like to continue growing across product, eCommerce, and CRO, as well as other digital design and marketing work.</p>", "priority": true, "digitas_rank": null, "needs_review": false}, {"id": 5, "title": "Were other people made redundant too?", "title_html": "Were <mark>other people made redundant</mark> too?", "body": "<p>Yes, <strong>it happened over several months</strong>, and several people were affected.</p><p>The business changed and the company lost some clients. It was a combination of factors.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 6, "title": "Blackpepper story — simple chronology", "title_html": "Blackpepper story — simple chronology", "body": "<p>First, Blackpepper posted an <strong>Intermediate UX/UI Designer position</strong>. I applied and got through the interview process, but they decided not to move forward because I didn't have enough UX experience.</p><p>A few days later, <strong>they posted a similar position</strong>. I contacted Angela, the recruiter, and she explained that the role had changed. It was more senior and more focused on UI.</p><p>She said <strong>I didn't have all the experience they were looking for,</strong> but she liked <strong>my attitude</strong> and believed I could learn quickly and grow into the role, so <strong>they decided to offer me the position.</strong></p><p>The title was Junior Designer, but the responsibilities in the contract <strong>were more aligned with an Intermediate or Senior role.</strong></p><p>I <strong>have evidence</strong> of this, including my conversation with Angela, so I'm happy to provide it if needed.</p><p class=\"note\">My understanding is that James referred to my official title when he gave the reference.</p>", "priority": true, "digitas_rank": null, "needs_review": false}, {"id": 7, "title": "When would you be available to start?", "title_html": "When would you be available to <mark>start?</mark>", "body": "<p>I can start in three to four weeks. <strong>I just need to align a few personal timings first.</strong></p><p>However, this role is a priority for me, so I'm very flexible to make it work. <strong>What start date do you have in mind?</strong></p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 8, "title": "What are your salary expectations?", "title_html": "What are your <mark>salary</mark> expectations?", "body": "<p>Based on the market and the role, my salary expectation is around $85,000 to $95,000 NZD. But I'm open to discuss it depending on the role and the full package.</p><p>This role is a priority for me, so I'm sure we can find a number that works for both of us.</p><p><strong style=\"color:#b91c1c\">If offered below budget:</strong> Thank you for letting me know. I was hoping for something closer to $85,000. Is there any flexibility on the salary?</p><p><strong style=\"color:#15803d\">If offered top of range (e.g., $90,000):</strong> That sounds good. I'm very interested in the role, so I'd like to review the full offer before making a decision. Could you send everything in writing?</p>", "priority": true, "digitas_rank": null, "needs_review": false}, {"id": 9, "title": "What Design Tools do you use?", "title_html": "What Design <mark>Tools</mark> do you use?", "body": "<p>I use a mix of tools depending on the project, but my main tool is Figma for UI design, wireframes, and developer handoff.</p><p>I also use Framer or Wordpress for websites, and Adobe Photoshop, Illustrator, and InDesign for print and digital assets.</p><p>Additionally, I use AI tools to speed up my workflow, such as ChatGPT, Claude, Claude Design, Figma Make, and Relume.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 10, "title": "Why do you want to work here? Why should we hire you? Why do you think you're a good fit for this role?", "title_html": "Why do you <mark>want to work here</mark>? Why should we <mark>hire you</mark>? Why do you think you're a <mark>good fit for this role</mark>?", "body": "<p>I'm looking for a place where <strong>design, business, creative and technology work together.</strong></p>\n<p>This opportunity is very interesting to me because it’s a strong match with my experience. I’ve worked across digital design, eCommerce, CRO, websites, EDMs, and digital campaigns.</p>\n<p>I also like the opportunity to work with different projects and brands such as…Toyota, McDonald’s, Vero, and Z Energy. I think that would be a great opportunity to learn and grow.</p>\n<p>Another thing I like is that Digitas is part of <strong>Publicis Groupe</strong>, a large global network. I think it would be a great opportunity to work with talented people and be part of a global team.</p>\n<p>Finally, I’m also interested in working with companies that are open to AI and see it as a tool that can improve the design process.</p>", "priority": true, "digitas_rank": 2, "needs_review": false}, {"id": 11, "title": "How would you feel being the Sole Designer?", "title_html": "How would you feel being the <mark>Sole Designer</mark>?", "body": "<p>I feel completely comfortable with this because I've done it before.</p><p>At <strong>Tourism Waitaki</strong>, I was the <strong>sole designer for the region</strong>, managing projects from start to finish.</p><p>I really enjoy the autonomy and responsibility that comes with the role, but I also know when to ask questions, share ideas, or involve the team when needed.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 12, "title": "How do you use AI in your design process?", "title_html": "How do you use <mark>AI in your design process</mark>? / How do you think <mark>AI will change the role of designers</mark>?", "body": "<p>Well, I think AI is becoming a very important part of the design process. <strong>I use it as a tool, but I still need to guide it and use my own design judgment.</strong></p>\n<p>For example, at <strong>Blackpepper</strong>, we used ChatGPT to <strong>analyse customer reviews</strong> for Glassons and find patterns. It helped us understand a lot of customer feedback much faster than doing it manually.</p>\n<p>I also use tools like <strong>Figma Make and Relume</strong> to explore ideas, create wireframes, and test different flows and prototypes quickly. I also use <strong>Claude with existing design systems</strong> to create and adapt assets faster while keeping the design consistent.</p>\n<p>I also use AI to analyse briefs and information, and to review my work for usability or other issues.</p>\n<p><strong>So, for me, AI is a tool. You still need to ask the right questions, guide it, and use your own judgment.</strong></p>", "priority": true, "digitas_rank": 7, "needs_review": false}, {"id": 13, "title": "What are your strengths?", "title_html": "What are your <mark>strengths</mark>?", "body": "<p>My main strength is connecting strong visual design with business and technical thinking.</p><p>I can move between product interfaces, eCommerce, design systems, websites, landing pages, EDMs, campaigns, and brand communications without losing sight of consistency or the customer journey.</p><p>I am also comfortable working autonomously, collaborating across disciplines, and translating complex requirements into clear, practical solutions.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 14, "title": "What is a weakness or area you'd like to improve?", "title_html": "What is a weakness or <mark>area you'd like to improve?</mark>", "body": "<p>One area I'm working on is becoming more confident when presenting and explaining my design work in English. I can communicate my ideas clearly, but I want to become more confident and natural when presenting to clients and stakeholders.</p><p>I'm actively working on improving my English and becoming more confident in these situations.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 15, "title": "How do you approach your brief / design process / workflow / customer journey?", "title_html": "How do you approach your <mark>brief / design process / workflow / customer journey</mark>?", "body": "<p><em>(Rol: Product Designer / UX-UI)</em></p>\n<p><em>Brief → evidence → solution exploration/testing → design system/developers/handoff → measure/iterate.</em></p>\n<p>I start by <strong>understanding the brief:</strong> the goals, the <strong>users</strong>, the <strong>problem</strong>, any constraints, and the deadline. If something isn't clear, I prefer to ask questions early.</p>\n<p>Then I <strong>review any available data,</strong> such as analytics, customer feedback, A/B testing, heatmaps, or a heuristic analysis, to understand the problem and find opportunities.</p>\n<p>Then I <strong>explore different solutions</strong> through quick wireframes and prototypes to test ideas early. Once we agree on a direction, I develop the design using the Design System when there’s one.</p>\n<p>I also <strong>work closely with developers</strong> and prepare the <strong>handoff</strong> to make sure the design is clear and ready for implementation.</p>\n<p><strong>After launch</strong>, it’s <strong>important</strong> to review the <strong>results</strong>, learn from the <strong>data</strong>, and <strong>iterate</strong> on the design. We always keep testing, learning, and improving.</p>", "priority": true, "digitas_rank": 3, "needs_review": false}, {"id": 16, "title": "How do you approach generating creative concepts for a project? What is your creative process?", "title_html": "How do you approach <mark>generating creative concepts</mark> for a project? What is your <mark>creative process</mark>?", "body": "<p><a href='https://dariobazan.framer.website/work/it-s-famouse-because-it-s-good' target='_blank' rel='noopener'>It's Famous because It's Good — case study</a></p>\n<p><em>(Rol: Digital Designer / Creative)</em></p>\n<p><em>Brief → context/references → creative exploration → execution/brand consistency → learnings.</em></p>\n<p>I start by <strong>understanding the brief:</strong> the goals, the <strong>audience</strong>, the <strong>message</strong>, any constraints, and the deadline. If something isn't clear, I prefer to ask questions early.</p>\n<p>Then <strong>I review the</strong> <strong>brand</strong>, the market, competitors, and relevant references to understand the context and find creative opportunities.</p>\n<p>Then I <strong>explore different creative directions</strong> using quick sketches, visual references, and examples, and share early ideas with the team to get feedback.</p>\n<p>Once we <strong>agree on a direction</strong>, I <strong>develop the concept</strong> across different channels and formats, making sure the brand stays consistent.</p>\n<p>It’s not always easy to measure a campaign, but when we have results, I think it’s valuable to learn from them and use those insights for future campaigns.</p>", "priority": true, "digitas_rank": 4, "needs_review": false}, {"id": 17, "title": "Tell me about a project you are particularly proud of. / Tell me about a time you improved conversion.", "title_html": "Tell me about a <mark>project you are particularly proud of</mark>. / Tell me about a time you <mark>improved conversion</mark>.", "body": "<p><strong>⭐ Huntech – Short Version (60–90 sec)</strong></p><p><strong>Context → Role → Heuristic analysis → Findings → Design opportunities → Delivery → Results → Learning.</strong></p><p>Huntech is a New Zealand outdoor retailer specialising in technical hunting gear and equipment. However, its eCommerce experience was no longer keeping up with the needs of the business, and there were several opportunities to improve the shopping experience and conversion.</p><p>My role was to lead the UI redesign, working within a multidisciplinary team under our Design Lead.</p><p>Before designing, I conducted a heuristic analysis to identify the biggest opportunities, so we focused on the PDP and PLP, where customers compare products and make purchase decisions.</p><p>I grouped the findings into three main areas: Usability, Comprehension, and Merchandising. From these, I identified five key design opportunities: Product Confidence, Product Discovery, Mobile Filtering, Product Communication, and Shopping Efficiency.</p><p>I also contributed to the Design System and prepared the handoff for the developers.</p><p>After launch, Blackpepper reported a 125% increase in revenue and a 41% increase in Average Order Value.</p><p>Many factors can influence these results, but the project showed me how good UI design can reduce uncertainty, improve the customer experience, and support business goals.</p>", "priority": true, "digitas_rank": 8, "needs_review": false}, {"id": 18, "title": "Huntech Long Version", "title_html": "Huntech Long Version", "body": "<p><strong>⭐ Huntech – Long Version (3–5 min)</strong></p><p><em>For presenting the full case study while sharing your screen and walking the interviewer through the portfolio.</em></p><p>Huntech is a New Zealand outdoor retailer specialising in technical hunting gear and equipment.</p><p>However, its eCommerce experience was no longer keeping up with the needs of the business. The platform had several limitations that affected the shopping experience and created opportunities to improve conversion.</p><p><strong>My Role</strong></p><p>My role was to lead the UI redesign, working within a multidisciplinary team under our Design Lead.</p><p>I was responsible for identifying key usability issues, translating findings into practical UI solutions, contributing to the Design System, and preparing the designs for developer handoff.</p><p><strong>Audit &amp; Diagnosis</strong></p><p>Before designing, I wanted to understand where we could create the biggest impact. I conducted a heuristic analysis across the purchase journey to identify friction points affecting both the user experience and business goals.</p><p>The review uncovered opportunities around Usability, Comprehension, and Merchandising.</p><p>Rather than redesigning the entire website, we focused on the Product Listing Page and Product Detail Page because that's where customers compare products and make purchase decisions.</p><p>The goal was to reduce purchase uncertainty and help users make decisions with greater confidence.</p><p><strong>Design Decisions</strong></p><p>From the findings, I prioritised the highest-impact opportunities and translated them into <strong>five key design decisions.</strong></p><p><strong>1. The first was Product Confidence.</strong></p><p>Users couldn't always see stock availability, sizing was inconsistent, and the Size Guide wasn't very visible.</p><p>I introduced real-time stock visibility, standardised sizing patterns, and a more visible Size Guide to reduce uncertainty around size and stock.</p><p><strong>2. The second was Product Discovery.</strong></p><p>The mobile navigation was unclear, search had no guidance, and the category structure was too text-heavy.</p><p>I introduced a clearer navigation structure, guided search, and visual category tiles to help users find products faster and reduce uncertainty.</p><p><strong>3. The third was Mobile Filtering.</strong></p><p>The filtering experience required multiple steps, there was no sorting option, and some touch targets were too small on mobile.</p><p>I combined filtering and sorting into one flow and introduced larger, touch-safe controls to make the experience easier to use on mobile.</p><p><strong>4. The fourth was Product Communication.</strong></p><p>Important product benefits were mainly explained through text, and the Add to Cart button wasn't always visible.</p><p>I introduced visual icons for key product benefits and a sticky Add to Cart button to make product information clearer and keep the purchase action visible.</p><p><strong>5. The last was Shopping Efficiency.</strong></p><p>Users had to open the product page before adding an item to the cart, and product cards were inconsistent.</p><p>I introduced Quick Add directly from the Product Listing Page and made the product cards more consistent, helping users shop more efficiently.</p><p><strong>Design System &amp; Delivery</strong></p><p>Alongside the redesign, I also worked within the existing Design System, adapting and expanding components to support Huntech's specific needs and create a more consistent purchase experience.</p><p>I documented the final designs in Figma and prepared them for developer handoff.</p><p><strong>Impact</strong></p><p>After launch, Blackpepper reported a 125% increase in revenue and a 41% increase in Average Order Value.</p><p>While many factors can influence business performance, these results suggest that reducing uncertainty and improving the purchase experience can contribute to stronger commercial outcomes.</p><p><strong>Reflection</strong></p><p>The biggest lesson for me from this project was that reducing uncertainty doesn't always mean simplifying the interface.</p><p>Users needed confidence that the size was available, the product was right for them, and it was worth the price.</p><p>For me, this project showed how thoughtful UI design can support purchase decisions while balancing user needs and business goals.</p>", "priority": true, "digitas_rank": null, "needs_review": false}, {"id": 19, "title": "How has your design work contributed to business outcomes?", "title_html": "How has your <mark>design</mark> work <mark>contributed to business outcomes</mark>?", "body": "<p>One example is the <strong>Huntech eCommerce project</strong> where I conducted a heuristic evaluation of the purchase journey and identified usability issues creating friction across the PLP and PDP.</p><p>Rather than redesigning everything, I prioritised the highest-impact opportunities and translated the findings into practical UI improvements that made product discovery, evaluation, and purchasing clearer.</p><p>The objective was to reduce friction, increase user confidence, and support conversion while balancing user needs, business goals, and technical feasibility.</p><p>The project reinforced how thoughtful design decisions can positively influence both the customer experience and commercial performance.</p>", "priority": true, "digitas_rank": null, "needs_review": false}, {"id": 20, "title": "How do you balance user needs, business goals, and technical constraints?", "title_html": "How do you <mark>balance user needs, business goals, and technical constraints</mark>?", "body": "<p>I believe <strong>the best solutions create value for everyone.</strong></p>\n<p>Before making a design decision, I try to understand the user needs, the business goals, and any technical constraints.</p>\n<p>Sometimes there are <strong>trade-offs</strong>, but in that case, I think the <strong>best approach is to</strong> <strong>work with the team</strong>, understand what is most important, and find the right balance.</p>\n<p class=\"note\"><strong>\"Trade-off\"</strong> significa una situación donde para ganar algo, tenés que ceder algo a cambio — no podés tener las dos cosas al 100%.</p>", "priority": true, "digitas_rank": null, "needs_review": false}, {"id": 21, "title": "Describe a difficult task you were faced with and how you addressed it.", "title_html": "Describe a <mark>difficult task</mark> you were faced with and how you addressed it.", "body": "<p>In a past project, we had a <mark>very tight deadline and a technical misalignment</mark> and the developer told me <strong>that a key component was too difficult to build at that time.</strong></p><p>My responsibility here <strong>was balancing technical limitations without losing design quality.</strong></p><p>So, <strong>instead of pushing back</strong>, I preferred to <strong>call him</strong> and we checked the Figma files together, and <mark>we found a balanced solution.</mark></p><p>The solution was that <mark>I tweaked the UI layout a bit</mark> to <strong>save development time</strong>, without <strong>hurting the core user experience.</strong></p><p>For me, working closely with devs is key to launching products fast with great quality.</p>", "priority": true, "digitas_rank": null, "needs_review": true}, {"id": 22, "title": "Tell me about a technical limitation you faced and how you worked with the developer to solve it.", "title_html": "Tell me about a <mark>technical limitation</mark> you faced and how you worked with the developer to solve it.", "body": "<p>One example was during an eCommerce project at Blackpepper where I designed a store availability experience for the product page, with Delivery, In Store, and Click &amp; Collect options.</p><p>During the technical review, the developer explained that the platform couldn't support the original design at that stage.</p><p>So, I adapted the design and we shipped a simpler version that showed general availability information instead of real-time store stock.</p><p>Later, when the platform was updated, we were able to implement the original concept.</p><p>For me, it's about collaborating with developers, being flexible, and delivering the best possible product within the current constraints.</p><p><em>Follow-up: What did the simplified version look like?</em></p><p>Instead of showing real-time stock for each store, we showed general availability information.</p><p>Users could still see that the product was available, but they couldn't select a specific store or see live stock information.</p><p>It wasn't the ideal experience, but it gave users the key information they needed and allowed us to launch the feature until the platform could support the full experience.</p>", "priority": true, "digitas_rank": null, "needs_review": true}, {"id": 23, "title": "How do you communicate design decisions to stakeholders?", "title_html": "How do you <mark>communicate design decisions to stakeholders</mark>?", "body": "<p>I start by <strong>explaining the problem before presenting the solution</strong>. Then I explain how my <strong>design decisions support</strong> the user needs, the business goals, and any technical constraints.</p>\n<p>I explain the thinking behind the design and why I chose that solution.</p>\n<p>I also believe <strong>feedback</strong> is important. So I listen carefully and ask the right questions, because stakeholders can bring useful information.</p>\n<p>The goal is to <strong>stay aligned and find the best solution together.</strong></p>", "priority": true, "digitas_rank": 5, "needs_review": false}, {"id": 24, "title": "How do you handle feedback or criticism?", "title_html": "How do you <mark>handle feedback or criticism</mark>?", "body": "<p>For me, feedback is a <strong>great opportunity to improve our work.</strong> It’s important to listen carefully, ask the right questions, and put our ego aside.</p>\n<p>If I have a different perspective, I explain my thinking, and I believe we can work together to find the best solution.</p>", "priority": true, "digitas_rank": 6, "needs_review": false}, {"id": 25, "title": "How do you ensure accessibility in your designs?", "title_html": "How do you ensure <mark>accessibility</mark> in your designs?", "body": "<p>I think about accessibility throughout the process, not just as a final check.</p><p>I focus on things like colour contrast, readable typography, and touch target size, and I avoid relying on colour alone to communicate meaning.</p><p>I also work closely with developers to support keyboard navigation and screen readers, and to meet any formal accessibility standards the project requires.</p>", "priority": false, "digitas_rank": null, "needs_review": true}, {"id": 26, "title": "How do you handle disagreement with a stakeholder or team member on a design decision?", "title_html": "How do you handle <mark>disagreement</mark> with a stakeholder or team member on a design decision?", "body": "<p>First, I listen and try to understand why they have concerns.</p>\n<p>Then I explain the thinking behind the decision and connect it to the brief, the users, the brand, or the business goal.</p>\n<p>If I learn something new from their feedback, I'm happy to change the idea. If I still believe my solution is stronger, I'll explain why and use prototypes or examples to show my thinking.</p>\n<p>For me, it's about working together to find the best solution for the users and the business.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 27, "title": "How do you work with copywriters and content teams?", "title_html": "How do you work with <mark>copywriters and content teams?</mark>", "body": "<p>I have experience working closely with copywriters and content teams across both Tourism Waitaki and Blackpepper.</p>\n<p>At Tourism Waitaki, I worked with a colleague responsible for campaign copy, blog content, and other communications.</p>\n<p>At Blackpepper, I worked closely with the SEO team, who provided copy for websites, blog content, EDMs, and other digital projects.</p>\n<p>I worked with them to make sure the content and design worked well together. I think involving content teams early creates a stronger overall experience.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 28, "title": "How do you collaborate with PMs?", "title_html": "How do you <mark>collaborate with PMs</mark>?", "body": "<p>I collaborate with Project Managers through clear communication, transparency, and alignment.</p><p>Before I start designing, I make sure I understand the brief, the goals, the requirements, the priorities, and the deadlines.</p><p>During the project, I keep the PM updated on my progress. If something is unclear or if I see a risk, I prefer to communicate it early.</p><p>I also try to be flexible because requirements can change.</p><p>My goal is to stay aligned with the team, ask the right questions, and help the team deliver the project successfully.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 29, "title": "How do you collaborate with developers?", "title_html": "How do you collaborate with <mark>developers?</mark>", "body": "<p>I like to work closely with developers throughout the project, not just at the end. I involve them early to understand any technical constraints and discuss what is realistic to build.</p>\n<p>During the project, I prepare clean and organised Figma files with reusable components, different states, and clear documentation. I also add notes or examples when needed to make the design intent clear.</p>\n<p>I also have a basic understanding of HTML and CSS, which helps me communicate with developers and understand what is feasible to build.</p>\n<p>During implementation, I stay available to answer questions, review the work, and discuss any issues with developers to find the best solution.</p>", "priority": true, "digitas_rank": null, "needs_review": false}, {"id": 30, "title": "How do you collaborate with the Marketing team?", "title_html": "How do you <mark>collaborate with the Marketing team?</mark>", "body": "<p>I collaborate closely with Marketing to understand the campaign goals, the target audience, and the key message.</p><p>Before I start designing, I make sure I understand the brief, the objectives, the requirements, and the deadlines.</p><p>During the project, I keep clear communication to make sure the design supports both the marketing goals and the user experience.</p><p>The goal here is to deliver designs that are visually engaging, consistent with the brand, and support the overall business goals.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 31, "title": "What do you include in a design handoff?", "title_html": "What do you include in <mark>a design handoff?</mark>", "body": "<p>I make sure my Figma files are clean, organised, and ready for development.</p>\n<p>I include reusable components, layouts for different screen sizes, typography, spacing, colours, assets, and different states such as hover, loading, success, and error.</p>\n<p>When something isn't obvious, I add notes, examples, or documentation to make the design intent clear and reduce questions during development.</p>\n<p>I also stay available during implementation to answer questions, review the final build, and work with developers if any adjustments are needed.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 32, "title": "How do you use Design Systems or Libraries and component libraries?", "title_html": "How do you use Design <mark>Systems or component libraries?</mark>", "body": "<p>At Blackpepper, I helped maintain design systems for multiple eCommerce clients — adding new components, improving existing ones, and making sure everything stayed consistent and scalable. I worked in Figma using shared libraries, variants, auto layout, and design tokens for things like colour, typography, and spacing.</p>\n<p>I believe a good design system is valuable because it helps teams work faster, maintain consistency, and reduce mistakes, especially when working across multiple brands.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 33, "title": "How do you manage/handle multiple projects, priorities and deadlines?", "title_html": "How do you manage/handle multiple <mark>projects, priorities and deadlines?</mark>", "body": "<p>I handle multiple projects by <strong>staying organised and communicating clearly.</strong></p>\n<p>Before starting a project, I make sure I understand the brief, the priorities, the deadlines, and the business goals.</p>\n<p><strong>I prioritise my work based on</strong> the business impact, the deadlines, and discussions with the Project Manager.</p>\n<p><strong>At Blackpepper and Tourism Waitaki,</strong> I regularly managed multiple projects at the same time, working across different brands and teams, so I’m comfortable managing different priorities.</p>\n<p>And of course, <strong>if priorities change</strong>, I communicate early and work with the team to find the best solution.</p>", "priority": true, "digitas_rank": 9, "needs_review": false}, {"id": 34, "title": "How do you measure if a design is successful?", "title_html": "How do you measure if <mark>a design is successful?</mark>", "body": "<p>For me, success means improving both UX and business outcomes.</p>\n<p>I look at how the design reduces friction, brings clarity, and helps users complete their tasks.</p>\n<p>In eCommerce, relevant metrics include Conversion Rate, Cart Abandonment, and Average Order Value. In marketing and digital projects, I look at engagement, how clearly the message is communicated, and brand consistency across channels.</p>\n<p>In UX/UI, I also pay attention to qualitative feedback — if the experience feels clear and easy to use, even when there isn't hard data available.</p>\n<p>I haven't always tracked the metrics myself, but I design with those goals in mind and use available team data to inform and improve my work.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 35, "title": "What would you like to develop or learn?", "title_html": "What would you like to <mark>develop or learn?</mark>", "body": "<p>I already use UX principles, heuristic evaluation, and available insights to support my design decisions, but one area I'd like to develop is research, particularly A/B testing, heatmaps, user behaviour data, and user testing.</p><p>I think this will help me make better design decisions based on data.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 36, "title": "Do you have experience with UX research, A/B testing, heatmaps, or journey maps?", "title_html": "Do you have experience with <mark>UX research, A/B testing, heatmaps, or journey maps?</mark>", "body": "<p>I studied UX/UI formally, so I understand methods such as A/B testing, heatmaps, and journey mapping. In my previous roles, that side was usually handled by someone else on the team, such as a Design Lead or research specialist.</p><p>My role was to take the available data and insights and turn them into design decisions. I also use UX principles and heuristic evaluation to review and improve digital experiences.</p><p>At Blackpepper, working in a CRO-focused eCommerce agency helped me develop this approach. Metrics such as conversion rate, cart abandonment, and Average Order Value were part of how I thought about design.</p><p>I haven't had many opportunities to apply these methods in my professional work, so I'd like to get more practical experience and continue developing these skills.</p>", "priority": true, "digitas_rank": null, "needs_review": false}, {"id": 37, "title": "Tell me about your experience with Brand Guidelines?", "title_html": "Tell me about your experience with <mark>Brand Guidelines</mark>?", "body": "<p>I have extensive experience working with brand guidelines because my background is in Graphic Design and I've been doing this for many years.</p><p>At Tourism Waitaki and Blackpepper, I worked with brand guidelines for well-known brands such as Torpedo7, Kings Plant Barn, and Alps 2 Ocean.</p><p>I'm very comfortable following and managing brand guidelines to ensure consistency across all customer touchpoints.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 38, "title": "Tell me about your digital marketing experience?", "title_html": "Tell me about your <mark>digital marketing experience</mark>?", "body": "<p>I've worked closely with marketing teams throughout my career.</p>\n<p>At <strong>Tourism Waitaki</strong>, I supported digital campaigns for our main brand and sub-brands, such as Tourism Waitaki, Alps 2 Ocean, and the Oamaru Blue Penguin Colony.</p>\n<p>I worked across different channels, including social media, websites, landing pages, EDMs, digital assets, banners, and other campaign materials.</p>\n<p>At <strong>Blackpepper</strong>, I did similar work for our own brands and also for different clients, adapting the design to their brand, audience, and campaign goals.</p>\n<p>I usually worked from marketing briefs and helped translate the message and campaign goals into clear visual communication across different channels.</p>", "priority": true, "digitas_rank": 10, "needs_review": false}, {"id": 39, "title": "Tell me about your EDM experience?", "title_html": "Tell me about your <mark>EDM experience</mark>?", "body": "<p>I've worked with <strong>EDMs and CRM communications</strong> throughout my career.</p>\n<p>At <strong>Tourism Waitaki</strong>, I designed regular EDMs for the main brand and sub-brands like Alps 2 Ocean and the Oamaru Blue Penguin Colony.</p>\n<p>At <strong>Blackpepper</strong>, I worked on EDMs for our own company and for clients such as Torpedo7 and King Plant Barn.</p>\n<p>For <strong>King Plant Barn, for example</strong>, I worked on different customer communications, including birthday emails, abandoned carts, back-in-stock emails, promotions, and other campaigns.</p>", "priority": true, "digitas_rank": 11, "needs_review": false}, {"id": 40, "title": "Do you have experience with Lifecycle Marketing?", "title_html": "Do you have experience with <mark>Lifecycle Marketing</mark>?", "body": "<p>Yes, I have experience with lifecycle marketing, mainly <strong>through my work with</strong> <strong>EDMs and customer communications.</strong></p>\n<p>At <strong>Blackpepper,</strong> I designed different types of <strong>EDMs for</strong> clients such as <strong>King Plant Barn</strong>, including birthday emails, abandoned carts, back-in-stock emails, promotions, and member communications.</p>\n<p>These communications were part of the customer journey, so I made sure the design matched the audience and the goal.</p>\n<p class=\"note\"><strong>Lifecycle Marketing:</strong> Significa <strong>adaptar la comunicación según el momento en</strong> <strong>que está el cliente en su relación con una marca</strong>. Por ejemplo, no le das el mismo mensaje a alguien que recién llega, que a alguien que abandonó un carrito o que ya es un cliente frecuente.</p>", "priority": true, "digitas_rank": 12, "needs_review": false}, {"id": 41, "title": "Tell me about your eCommerce experience.", "title_html": "Tell me about your eCommerce <mark>experience.</mark>", "body": "<p>My strongest eCommerce experience comes from Blackpepper, a specialist eCommerce agency and partner of Google, Meta, and Shopify.</p>\n<p>I worked on eCommerce websites and apps for major brands such as Starbucks, Glassons, Hallenstein, and Torpedo7, with a strong focus on CRO and improving the customer experience and business outcomes.</p>\n<p>Working in an agency environment also gave me the opportunity to work across different brands, projects, and business needs, while collaborating closely with developers, project managers, and other designers.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 42, "title": "Tell me about your Shopify experience?", "title_html": "Tell me about your Shopify <mark>experience?</mark>", "body": "<p>I have limited direct experience with Shopify.</p>\n<p>Blackpepper became a certified Shopify partner relatively recently, close to when my role ended, so I didn't have much opportunity to work directly with the platform. However, I have strong eCommerce experience from working at Blackpepper, a specialist eCommerce agency and partner of Google, Meta, and Shopify.</p>\n<p>I worked on eCommerce websites and apps for brands such as Starbucks, Glassons, Hallenstein, and Torpedo7, with a strong focus on CRO and the customer experience.</p>\n<p>So while my direct Shopify experience is limited, I have a strong understanding of eCommerce design and I'm confident I can learn the platform quickly.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 43, "title": "Tell me about your experience with motion graphics or animation.", "title_html": "Tell me about your experience <mark>with motion graphics or animation.</mark>", "body": "<p>I have some experience with motion graphics and animation.</p>\n<p>A while ago, I took an After Effects course and have also created simple animations in Figma and Framer.</p>\n<p><strong>Motion hasn't been a major part of my previous roles, so it's not my strongest skill yet.</strong> However, I'd like to develop this skill and explore how motion can improve digital experiences.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 44, "title": "If you were joining our team, how would you approach your first few weeks", "title_html": "If you were <mark>joining our team</mark>, how would <mark>you approach</mark> your first few weeks", "body": "<p>If I joined the team tomorrow, my first priority would be to learn.</p><p>I'd spend time understanding the product, the users, the business goals, and the current priorities.</p><p>I'd also like to meet the team, learn how they work together, and understand the existing design system and development process.</p><p>Once I have that context, I'd start looking for opportunities where I can add value and contribute as quickly as possible.</p>", "priority": false, "digitas_rank": null, "needs_review": false}, {"id": 45, "title": "How do you approach improving an eCommerce platform you're new to?", "title_html": "How do you approach <mark>improving an eCommerce</mark> platform you're new to?", "body": "<p>I approach it in <strong>three steps.</strong></p><p><mark>First, research.</mark> I learn about the business goals, the target audience, and review any available data to understand where users are dropping off.</p><p><mark>Second, I conduct a heuristic analysis of the platform</mark>, especially on mobile. I review key pages and user flows to identify friction points and opportunities for improvement.</p><p><mark>Finally, I prioritise with a CRO mindset.</mark> I don't try to redesign everything at once. <strong>I focus on Conversion Rate first, then Cart Abandonment, and finally Average Order Value,</strong> so I can create the most value for both users and the business.</p>", "priority": true, "digitas_rank": null, "needs_review": true}, {"id": 46, "title": "How do you measure the success of your designs in eCommerce?", "title_html": "How do you measure the <mark>success</mark> of your designs <mark>in eCommerce</mark>?", "body": "<p>For me, success means improving both the user experience and the business results.</p><p>In eCommerce, I focus on metrics such as <strong>Conversion Rate, Cart Abandonment, and Average Order Value.</strong></p><p>A successful design is one that helps users and supports business growth.</p>", "priority": false, "digitas_rank": null, "needs_review": true}, {"id": 47, "title": "How do you analyse user behaviour to improve your designs?", "title_html": "How do you <mark>analyse user behaviour to improve your designs</mark>?", "body": "<p>I look at the data insights and friction points. In practice, at Blackpepper, we used heuristic analysis to review the site and identify where users were dropping off on the PLP and PDP.</p><p>For example, on the Huntech project, we analysed the behavior and found that users were leaving because the size selection was confusing on mobile and the CTA was buried.</p><p>My job is to take those insights and translate them into better UI layouts and cleaner components in Figma to solve that behavior.</p>", "priority": false, "digitas_rank": null, "needs_review": true}, {"id": 48, "title": "What is CRO?", "title_html": "What is <mark>CRO</mark>?", "body": "<p>For me, CRO is about finding and removing friction points in the user journey to help users complete their goals and improve business outcomes, such as conversion rate or sales.</p>", "priority": true, "digitas_rank": null, "needs_review": true}, {"id": 49, "title": "How do you approach CRO and conversion-focused design?", "title_html": "How do you approach <mark>CRO and conversion-focused design</mark>?", "body": "<p>My approach starts with identifying friction points through techniques like heuristic analysis, analytics, heatmaps, session recordings, or A/B testing.</p><p>Then, I focus on three key areas.</p><p><strong>First, Conversion Rate</strong>, by making the core journey simple and easy to complete.</p><p><strong>Second, Cart Abandonment</strong>, by removing the reasons why users drop off during the purchase journey.</p><p><strong>Finally, Average Order Value</strong>, by finding opportunities to add value to each order through upselling or cross-selling.</p><p><strong>For example</strong>, in my <strong>Huntech project</strong>, I used heuristic analysis to identify friction points on mobile.</p><p>After launch, the agency reported a 125% increase in revenue and a 41% increase in Average Order Value year-on-year.</p>", "priority": true, "digitas_rank": null, "needs_review": true}, {"id": 50, "title": "eCommerce & CRO Framework", "title_html": "eCommerce &amp; CRO Framework <span class=\"note-inline\">(apuntes personales)</span>", "body": "<p class=\"note\"><strong>1. CR / CVR (Conversion Rate)</strong><br>Es la métrica principal. Si la web no <strong>convierte</strong>, ninguna otra métrica importa. Todo tu trabajo de UX/UI impacta directamente acá.</p><p class=\"note\"><strong>2. Cart Abandonment Rate</strong><br>Es el cuello de botella más crítico. El usuario ya <strong>mostró intención de compra</strong> (metió algo al carrito) pero se trabó al final. Tu foco en el diseño del checkout es bajar este porcentaje.</p><p class=\"note\"><strong>3. AOV (Average Order Value)</strong><br>Una vez que lográs que la web convierta de forma estable (Paso 1 y 2), el siguiente paso del negocio es que cada <strong>cliente gaste más plata</strong> en esa compra a través de componentes de Upselling o Cross-selling.</p><p><mark>In short: First, increase conversion (CR); second, lower cart abandonment; and third, raise the average spend (AOV).</mark></p><p class=\"note\">Others Metrics:</p><p class=\"note\"><strong>4. CTA &amp; Above the Fold</strong><br>Son tus herramientas tácticas visuales en Figma. El contraste del botón y la ubicación en mobile (above the fold) son los elementos de diseño que usás para mover los números de arriba.</p><p class=\"note\"><strong>5. Bounce Rate (Tasa de Rebote)</strong><br>Te dice si la Landing Page o la Home están comunicando bien la propuesta de valor. Es clave, pero muchas veces depende también de si el equipo de marketing está trayendo al público correcto a la web.</p><p class=\"note\"><strong>6. Revenue Growth (Crecimiento de Ingresos)</strong><br>Es el objetivo final del dueño de la empresa, pero para vos es una consecuencia indirecta. Vos no controlás el precio de los productos ni el stock. Vos mejorás la experiencia de usuario (CR y AOV), y eso genera Revenue Growth. En la entrevista la usás para demostrar que te importa el negocio, pero no es una métrica de diseño pura.</p><p class=\"note\"><strong>7. LTV o CLV (Customer Lifetime Value - Valor de Vida del Cliente)</strong><br>Mide cuánta plata gasta un cliente a lo largo de meses o años. Aunque un buen diseño ayuda a que la experiencia sea memorable y el cliente vuelva, la recompra depende un 80% de la calidad del producto, la atención al cliente, el envío y el email marketing. Está fuera de tu control directo en el día a día del diseño web.</p><p class=\"note\"><strong>8. CAC (Customer Acquisition Cost - Costo de Adquisición)</strong><br>Esto es 100% terreno del equipo de Marketing Digital (los que arman las campañas en Google Ads, Meta, Instagram). Ellos miden cuánta plata queman en publicidad para traer un clic. A vos te importa saberlo porque si el tráfico es caro, tu Landing Page tiene que ser perfecta para no desperdiciar ese presupuesto, pero vos no manejás el costo del anuncio.</p><p class=\"note\"><strong>9. Below the Fold</strong><br>Es simplemente un concepto de ubicación física en la pantalla. Es el opuesto de Above the fold. Es relevante para saber dónde ubicar la información secundaria (especificaciones técnicas, reviews), pero operativamente se maneja en conjunto con el punto 4.</p><p class=\"note\"><strong>10. Upselling / Cross-selling (Prod Complementario o Relacionado)</strong><br>No son métricas, son estrategias comerciales. Son las técnicas que usás en la interfaz.<br><strong>Cross-selling:</strong> Ofrecer un producto complementario (ej: llevarte medias cuando comprás zapatillas).<br><strong>Upselling:</strong> Ofrecer una versión superior o más cara del mismo producto (ej: pasar de la campera base a la premium impermeable).<br>El resultado de ambas técnicas se mide directamente con el <strong>AOV</strong>.</p>", "priority": false, "digitas_rank": null, "needs_review": true}, {"id": 51, "title": "Do you have questions for us?", "title_html": "Do you have <mark>questions</mark> for us?", "body": "<p><strong>AI &amp; Workflow:</strong> Regarding AI in this role, is the main focus on speeding up design in Figma for developers, or do you expect end-to-end execution including generating code?</p><p><strong>Role Balance:</strong> What kind of work would I do most of the time? How is the balance between marketing campaigns and digital products like websites or apps?</p><p><strong>UI/UX vs. Marketing:</strong> What is the split between UI/UX design and marketing assets? What does a typical week look like?</p><p><strong>Daily Routine:</strong> What does a typical day look like in this role?</p><p><strong>Design Systems:</strong> Is there an existing design system or component library I will be using and expanding?</p><p><strong>Team Structure:</strong> How is the design team structured, and who will I work with most closely?</p><p><strong>Developer Collaboration:</strong> How do design and development teams collaborate here? Will I work directly with developers during implementation?</p><p><strong>Prioritization:</strong> How do you prioritize digital projects? Who decides what website improvements to make?</p><p><strong>Expectations:</strong> What key qualities or skills are you looking for in this person?</p><p><strong>Success Metrics:</strong> What would success look like in this role during the first six to twelve months?</p><p><strong>Business &amp; Friction:</strong> What is the biggest issue or drop-off point in the current user journey you want to fix this year?</p><p><strong>Career Growth:</strong> How do you see this role growing over time in terms of responsibilities?</p><p><strong>Company Vision:</strong> What excites you most about the company's future over the next few years?</p><p><strong>Next Steps:</strong> What are the next steps in the hiring process?</p>", "priority": false, "digitas_rank": null, "needs_review": true}];
const filtersEl=document.getElementById("filters");
const contentEl=document.getElementById("content");
const countEl=document.getElementById("count");
const searchEl=document.getElementById("search");
const clearSearchEl=document.getElementById("search-clear");
const emptyEl=document.getElementById("empty");
let activeFilter="ALL";

function renderFilters(){
  const fs=[["ALL","ALL"],["PRIORITY","PRIORITY"],["REST","REST"],["DIGITAS","DIGITAS"],["REVIEW","REVIEW"]];
  filtersEl.innerHTML=fs.map(([k,v])=>`<button class="filter ${k===activeFilter?"active":""}" data-filter="${k}">${v}</button>`).join("");
  filtersEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;renderFilters();render();});
}

function render(){
  const term=searchEl.value.trim().toLowerCase();
  clearSearchEl.style.display=term?"block":"none";
  let list=questions.filter(q=>{
    const filterOk=
      activeFilter==="ALL" ||
      (activeFilter==="DIGITAS" && q.digitas_rank) ||
      (activeFilter==="PRIORITY" && q.priority) ||
      (activeFilter==="REVIEW" && q.needs_review) ||
      (activeFilter==="REST" && !q.priority);
    const hay=(q.title+" "+q.body).toLowerCase();
    return filterOk && (!term || hay.includes(term));
  });
  if(activeFilter==="DIGITAS") list.sort((a,b)=>a.digitas_rank-b.digitas_rank);
  contentEl.innerHTML=list.map(q=>`
    <article class="card">
      <button class="card-btn" type="button">
        <div class="num">${q.id}</div>
        <div class="title">${q.title_html}</div>
        <div class="tags">${activeFilter==="DIGITAS" ? "DIGITAS #"+q.digitas_rank : (q.priority?"PRIORITY":"REST")}${q.needs_review?'<span class="review-badge">REVISAR</span>':''}</div>
        <span class="chev">⌄</span>
      </button>
      <div class="body">${q.body}</div>
    </article>`).join("");
  countEl.textContent=list.length;
  emptyEl.style.display=list.length?"none":"block";
  contentEl.querySelectorAll(".card-btn").forEach(b=>b.onclick=()=>b.closest(".card").classList.toggle("open"));
}

searchEl.addEventListener("input",render);
clearSearchEl.addEventListener("click",()=>{searchEl.value="";searchEl.focus();render();});
renderFilters();
render();
</script>
</body>
</html>
